/* --------------------------- scrolling backdrop ------------------------
   Three layers, back to front: far spires, mid spires, wind streaks. Both
   spire layers come off one tile -- the far one mirrored, scaled and offset
   -- which halves the inlined payload and still reads as depth at these
   alphas.

   The tile wraps vertically forever, so its top quarter is empty black and
   the seam is invisible. Any replacement art must keep that property; see
   docs/AI-ASSETS.md.

   Loading is deliberately not gated: a data URI needs no network, so it
   decodes within a frame or two. drawBackdrop() no-ops until then, which
   also serves as the failure path -- a corrupt blob degrades to the plain
   black background the game had before, rather than throwing.            */
const SKY = { img:new Image(), ready:false, h:CFG.H, far:0, mid:0 };
SKY.img.onload  = () => { SKY.ready = true; SKY.h = SKY.img.naturalHeight || CFG.H; };
SKY.img.onerror = () => { SKY.ready = false; };
SKY.img.src = BACKDROP_PNG;

function drawBackdrop(){
  if (!SKY.ready) return;
  const K = CFG.SKY, iw = SKY.img.naturalWidth, ih = SKY.h;
  // Only ever save/restore -- resize() holds a letterbox+DPR transform on ctx
  // that setTransform would wipe out. The shake in render() already covers us.

  // far layer: mirrored and scaled up, so the repeat does not read as a repeat
  ctx.save();
  ctx.globalAlpha = Math.min(K.farAlpha, K.maxAlpha);
  const fw = CFG.W * K.farScale, fh = ih * K.farScale, fx = (CFG.W - fw) / 2;
  ctx.translate(CFG.W, 0); ctx.scale(-1, 1);
  for (let k = 0; k < 2; k++)
    ctx.drawImage(SKY.img, 0, 0, iw, ih, fx, SKY.far - k*fh, fw, fh);
  ctx.restore();

  ctx.save();
  ctx.globalAlpha = Math.min(K.midAlpha, K.maxAlpha);
  for (let k = 0; k < 2; k++)
    ctx.drawImage(SKY.img, 0, 0, iw, ih, 0, SKY.mid - k*ih, CFG.W, ih);
  ctx.restore();
}

const WIND = [];
function buildWind(){
  WIND.length = 0;
  for (let i=0;i<64;i++)
    WIND.push({ x:rnd(CFG.W), y:rnd(CFG.H), len:rnd(46,10), sp:rnd(1,0.25) });
}
function updateSky(dt, boost){
  const b = boost || 1, K = CFG.SKY;
  SKY.far = (SKY.far + K.farSpeed * K.farScale * b * dt) % (SKY.h * K.farScale);
  SKY.mid = (SKY.mid + K.midSpeed * b * dt) % SKY.h;
  for (const w of WIND){
    w.y += (110 + w.sp*300) * (boost||1) * dt;
    if (w.y - w.len > CFG.H){ w.y = -rnd(40); w.x = rnd(CFG.W); w.len = rnd(46,10); }
  }
}
function drawSky(){
  drawBackdrop();
  ctx.lineWidth = 1;
  for (const w of WIND){
    ctx.strokeStyle = amber(0.05 + w.sp*0.13);
    ctx.beginPath(); ctx.moveTo(w.x, w.y); ctx.lineTo(w.x, w.y + w.len); ctx.stroke();
  }
}

/* =============================== INPUT ==================================
   Pointer Events with per-pointerId tracking, so the stick and the fire
   button work at the same time. Naive touch handling drops one of them.
   ======================================================================== */
const PAD = {
  stickZone: { x0:0, x1:280, y0:596, y1:CFG.H },
  stickR: 62,
  fire:  { x:472, y:866, r:47 },
  power: { x:366, y:866, r:39 },
};

const IN = {
  ax:0, ay:0,                 // analog movement, -1..1
  fire:false, power:false,    // held
  powerEdge:false,            // rising edge, consumed once
  pauseEdge:false,
  tap:null,                   // {x,y} for menu screens
  touchSeen:false,
  stick:{ id:-1, ox:0, oy:0, x:0, y:0, on:false },
  fireId:-1, powerId:-1,
  keys:Object.create(null),
};

function refreshKeyAxes(){
  const k = IN.keys;
  const l = (k.a||k.arrowleft)?1:0, r = (k.d||k.arrowright)?1:0;
  const u = (k.w||k.arrowup)?1:0,   d = (k.s||k.arrowdown)?1:0;
  if (!IN.stick.on){ IN.ax = r-l; IN.ay = d-u; }
  if (IN.fireId < 0) IN.fire = !!k[' '];
}

window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if ([' ','arrowup','arrowdown','arrowleft','arrowright','enter'].includes(k)) e.preventDefault();
  Audio2.unlock();
  if (IN.keys[k]) { refreshKeyAxes(); return; }        // ignore auto-repeat
  IN.keys[k] = true;
  if (k === 'enter'){ IN.power = true; IN.powerEdge = true; }
  if (k === 'p' || k === 'escape') IN.pauseEdge = true;
  if (k === 'm') toggleMute();
  if (!IN.tap) IN.tap = { key:k };
  refreshKeyAxes();
}, { passive:false });

window.addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  IN.keys[k] = false;
  if (k === 'enter') IN.power = false;
  refreshKeyAxes();
}, { passive:false });

window.addEventListener('blur', () => {
  IN.keys = Object.create(null);
  IN.ax = IN.ay = 0; IN.fire = false; IN.power = false;
  IN.stick.on = false; IN.stick.id = -1; IN.fireId = IN.powerId = -1;
});

function inCircle(p, c){ return dist2(p.x,p.y,c.x,c.y) <= c.r*c.r*1.35; }  // generous hit slop

cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  Audio2.unlock();
  IN.touchSeen = IN.touchSeen || e.pointerType !== 'mouse';
  const p = toGame(e.clientX, e.clientY);
  cv.setPointerCapture && cv.setPointerCapture(e.pointerId);

  if (showPad()){
    if (inCircle(p, PAD.fire) && IN.fireId < 0){ IN.fireId = e.pointerId; IN.fire = true; return; }
    if (inCircle(p, PAD.power) && IN.powerId < 0){
      IN.powerId = e.pointerId; IN.power = true; IN.powerEdge = true; return;
    }
    const z = PAD.stickZone;
    if (IN.stick.id < 0 && p.x >= z.x0 && p.x <= z.x1 && p.y >= z.y0 && p.y <= z.y1){
      IN.stick.id = e.pointerId; IN.stick.on = true;
      IN.stick.ox = clamp(p.x, PAD.stickR+8, z.x1 - PAD.stickR - 8);
      IN.stick.oy = clamp(p.y, z.y0 + PAD.stickR*0.4, CFG.H - PAD.stickR - 14);
      IN.stick.x = IN.stick.ox; IN.stick.y = IN.stick.oy;
      IN.ax = IN.ay = 0; return;
    }
  }
  IN.tap = { x:p.x, y:p.y };
}, { passive:false });

cv.addEventListener('pointermove', e => {
  if (e.pointerId !== IN.stick.id) return;
  e.preventDefault();
  const p = toGame(e.clientX, e.clientY);
  let dx = p.x - IN.stick.ox, dy = p.y - IN.stick.oy;
  const d = Math.hypot(dx, dy), R = PAD.stickR;
  if (d > R){ dx = dx/d*R; dy = dy/d*R; }
  IN.stick.x = IN.stick.ox + dx; IN.stick.y = IN.stick.oy + dy;
  const m = Math.min(1, d / R), dead = 0.14;
  if (m < dead){ IN.ax = IN.ay = 0; }
  else {
    const amt = (m - dead) / (1 - dead);          // 0..1 past the dead zone
    IN.ax = dx / (d || 1) * amt;                  // unit direction * magnitude
    IN.ay = dy / (d || 1) * amt;
  }
}, { passive:false });

function endPointer(e){
  const id = e.pointerId;
  if (id === IN.stick.id){ IN.stick.id = -1; IN.stick.on = false; IN.ax = IN.ay = 0; refreshKeyAxes(); }
  if (id === IN.fireId){ IN.fireId = -1; IN.fire = !!IN.keys[' ']; }
  if (id === IN.powerId){ IN.powerId = -1; IN.power = false; }
}
cv.addEventListener('pointerup', e => { e.preventDefault(); endPointer(e); }, { passive:false });
cv.addEventListener('pointercancel', e => endPointer(e), { passive:false });
cv.addEventListener('contextmenu', e => e.preventDefault());

function showPad(){ return IN.touchSeen || IS_TOUCH; }
function takeTap(){ const t = IN.tap; IN.tap = null; return t; }
function takePowerEdge(){ const p = IN.powerEdge; IN.powerEdge = false; return p; }
function takePauseEdge(){ const p = IN.pauseEdge; IN.pauseEdge = false; return p; }

/* ---------------------------- on-screen pad ---------------------------- */
function drawPad(){
  if (!showPad()) return;
  const s = IN.stick;
  ctx.lineWidth = 1.6;
  if (s.on){
    ctx.strokeStyle = amber(0.30);
    ctx.beginPath(); ctx.arc(s.ox, s.oy, PAD.stickR, 0, TAU); ctx.stroke();
    ctx.strokeStyle = purple(0.85);
    ctx.beginPath(); ctx.arc(s.x, s.y, 24, 0, TAU); ctx.stroke();
    ctx.strokeStyle = amber(0.22);
    ctx.beginPath(); ctx.moveTo(s.ox, s.oy); ctx.lineTo(s.x, s.y); ctx.stroke();
  } else {
    const z = PAD.stickZone, cx = 112, cy = 866;
    ctx.strokeStyle = amber(0.16);
    ctx.beginPath(); ctx.arc(cx, cy, PAD.stickR, 0, TAU); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cy, 22, 0, TAU); ctx.stroke();
    ctx.fillStyle = amber(0.24); ctx.font = '11px "Courier New",monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('MOVE', cx, cy - 80);
  }
  // FIRE
  const f = PAD.fire;
  ctx.strokeStyle = IN.fire ? CFG.AMBER : amber(0.40);
  ctx.lineWidth = IN.fire ? 2.6 : 1.6;
  ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, TAU); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(f.x, f.y-16); ctx.lineTo(f.x+11, f.y+12);
  ctx.lineTo(f.x, f.y+5);  ctx.lineTo(f.x-11, f.y+12);
  ctx.closePath(); ctx.stroke();
  // POWER (with cooldown ring)
  const q = PAD.power, rdy = powerReady();
  ctx.strokeStyle = rdy ? CFG.PURPLE : purple(0.28);
  ctx.lineWidth = rdy ? 2.6 : 1.6;
  ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, TAU); ctx.stroke();
  const frac = clamp(G.powerTimer / CFG.POWER.cooldown, 0, 1);
  if (frac < 1){
    ctx.strokeStyle = purple(0.75); ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(q.x, q.y, q.r-6, -Math.PI/2, -Math.PI/2 + TAU*frac); ctx.stroke();
  }
  ctx.strokeStyle = rdy ? CFG.PURPLE : purple(0.35); ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(q.x+4, q.y-16); ctx.lineTo(q.x-8, q.y+1);
  ctx.lineTo(q.x+1, q.y+1);  ctx.lineTo(q.x-4, q.y+16);
  ctx.lineTo(q.x+9, q.y-2);  ctx.lineTo(q.x, q.y-2);
  ctx.closePath(); ctx.stroke();
}

/* ============================= GAME STATE =============================== */
const pools = {
  pb  : new Pool(() => ({x:0,y:0,vx:0,vy:0,r:5,hr:5,dmg:0,tier:0,seed:0}), CFG.POOL.pBullets),
  eb  : new Pool(() => ({x:0,y:0,vx:0,vy:0,r:6,dmg:0,t:0}), CFG.POOL.eBullets),
  en  : new Pool(() => ({}), CFG.POOL.enemies),
  par : new Pool(() => ({x:0,y:0,vx:0,vy:0,life:0,max:1,len:3,pur:false}), CFG.POOL.particles),
  flo : new Pool(() => ({x:0,y:0,t:0,txt:'',pur:false}), CFG.POOL.floaters),
  rng : new Pool(() => ({x:0,y:0,t:0,dur:1,r0:0,r1:0,pur:false,w:2}), CFG.POOL.rings),
};

const P = { x:CFG.W/2, y:CFG.FIELD.bottom-70, hp:100, maxHP:100, damage:10,
            fireRate:2.5, cool:0, inv:0, flap:0, dead:false, hurtFlash:0 };

const G = {
  state:'title',              // title | story | playing | dead | victory | paused | options
  t:0, dt:0,
  kills:0, shards:0, souls:0, level:1, lordsKilled:0, powerTier:0, powerUses:0,
  phase:1,
  spawnTimer:2.2,
  boss:null, bossIntro:0, bossWin:0,
  powerTimer:CFG.POWER.cooldown, powerFx:null,
  shake:0, flash:0, card:null, cardT:0,
  shardPulse:0, soulPulse:0, healFlash:0, levelFx:null,
  hasSave:false, checkpoint:null,
  menuIdx:0, storyT:0, endT:0,
  frameMs:0,
};

const F = CFG.FIELD;
const phaseMul = k => Math.pow(CFG.PHASE_STEP[k], G.phase-1);
const enemyDmgMul = () => 1 + 0.14 * (G.phase-1);

function applyStats(keepRatio){
  const ratio = keepRatio ? P.hp / P.maxHP : 1;
  P.maxHP    = CFG.PLAYER.maxHP + (G.level-1) * CFG.LEVEL.hp;
  P.damage   = CFG.PLAYER.damage   * Math.pow(CFG.LEVEL.dmgMul,  G.level-1);
  P.fireRate = CFG.PLAYER.fireRate * Math.pow(CFG.LEVEL.rateMul, G.level-1);
  if (keepRatio) P.hp = clamp(P.maxHP * ratio, 1, P.maxHP);
}
function currentTier(){ return POWER_TIERS[G.powerTier]; }

/* Cindu's breath grows with her damage: 0 is the thin starting bolt, 4 is a
   full fireball. Thresholds are damage multiples, so the flame keeps pace
   with the stat rather than with a raw level count. */
function fireTier(){
  const g = P.damage / CFG.PLAYER.damage;
  return g >= 3.2 ? 4 : g >= 2.2 ? 3 : g >= 1.6 ? 2 : g >= 1.25 ? 1 : 0;
}
function powerReady(){
  return G.powerTimer >= CFG.POWER.cooldown &&
         P.hp >= P.maxHP * CFG.POWER.hpGate &&
         !P.dead && G.state === 'playing';
}

/* ------------------------------ effects -------------------------------- */
function burst(x, y, n, spd, pur, len){
  for (let i=0;i<n;i++){
    const p = pools.par.alloc(); if (!p) return;
    const a = rnd(TAU), s = rnd(spd, spd*0.25);
    p.x=x; p.y=y; p.vx=Math.cos(a)*s; p.vy=Math.sin(a)*s;
    p.max = p.life = rnd(0.75, 0.28); p.pur = !!pur; p.len = len || 4;
  }
}
function floater(x, y, txt, pur){
  const f = pools.flo.alloc(); if (!f) return;
  f.x=x; f.y=y; f.t=0; f.txt=txt; f.pur=!!pur;
}
/** An expanding stroked ring. The shockwave the reward chain was missing. */
function ring(x, y, r0, r1, dur, pur, w){
  const g = pools.rng.alloc(); if (!g) return;
  g.x=x; g.y=y; g.t=0; g.dur=dur; g.r0=r0; g.r1=r1; g.pur=!!pur; g.w=w || 2;
}
function showCard(txt, sub){ G.card = { txt, sub }; G.cardT = 2.6; }

/* ------------------------------ shooting ------------------------------- */
function playerShoot(){
  const b = pools.pb.alloc(); if (!b) return;
  const T = fireTier();
  b.x = P.x; b.y = P.y - 22; b.vx = 0; b.vy = -CFG.PLAYER.bulletSpeed;
  b.r = CFG.PLAYER.bulletR + Math.min(4, (G.level-1)*0.35);
  // The drawn flame is b.r * (1 + T*0.34). The hitbox follows at half that
  // rate, so a hit always lands inside the fire the player can see -- never
  // outside it -- while a late-game fireball still connects like one.
  b.hr = b.r * (1 + T * 0.17) + CFG.PLAYER.hitSlop;
  b.dmg = P.damage;
  b.tier = T; b.seed = rnd(TAU);
  Audio2.SFX.fire(P.fireRate, T);
  burst(P.x, P.y-24, 2 + T, 60 + T*22, true, 3);
}
function enemyShoot(e, ang, spd){
  const b = pools.eb.alloc(); if (!b) return;
  b.x=e.x; b.y=e.y; b.vx=Math.cos(ang)*spd; b.vy=Math.sin(ang)*spd;
  b.r=CFG.ENEMY.bulletR; b.dmg = CFG.ENEMY.bulletDmg * enemyDmgMul(); b.t=0;
}
function bossShoot(x, y, ang, spd, dmgMul){
  const b = pools.eb.alloc(); if (!b) return;
  b.x=x; b.y=y; b.vx=Math.cos(ang)*spd; b.vy=Math.sin(ang)*spd;
  b.r=7; b.dmg = CFG.ENEMY.bulletDmg * enemyDmgMul() * (dmgMul||1.15); b.t=0;
}
function aimAt(e){ return Math.atan2(P.y-e.y, P.x-e.x); }

/* ------------------------------- player -------------------------------- */
function updatePlayer(dt){
  if (P.dead) return;
  let ax = IN.ax, ay = IN.ay;
  const m = Math.hypot(ax, ay);
  if (m > 1){ ax/=m; ay/=m; }
  P.x = clamp(P.x + ax * CFG.PLAYER.speed * dt, F.left, F.right);
  P.y = clamp(P.y + ay * CFG.PLAYER.speed * dt, F.top,  F.bottom);
  P.flap += dt * (7 + Math.abs(ay)*4);
  P.inv = Math.max(0, P.inv - dt);
  P.hurtFlash = Math.max(0, P.hurtFlash - dt*3);

  P.cool -= dt;
  if (IN.fire && P.cool <= 0){ playerShoot(); P.cool = 1 / P.fireRate; }
  if (P.cool < -0.2) P.cool = 0;

  G.powerTimer = Math.min(CFG.POWER.cooldown, G.powerTimer + dt);
  if (takePowerEdge()){
    if (powerReady()) firePower();
    else Audio2.SFX.deny();
  }
}
function damagePlayer(amount){
  if (P.inv > 0 || P.dead) return;
  P.hp -= amount; P.inv = CFG.PLAYER.iframes; P.hurtFlash = 1;
  G.shake = Math.max(G.shake, 7);
  burst(P.x, P.y, 10, 170, true, 5);
  if (P.hp <= 0){ P.hp = 0; killPlayer(); } else Audio2.SFX.hurt();
}
function killPlayer(){
  P.dead = true; G.state = 'dead'; G.endT = 0;
  Audio2.stopMusic(); Audio2.SFX.playerDie();
  burst(P.x, P.y, 60, 300, false, 8); burst(P.x, P.y, 40, 220, true, 6);
  G.shake = 22; G.flash = 1;
}

/* ------------------------------- enemies ------------------------------- */
function spawnEnemy(type){
  const A = ARCHETYPES[type];
  const e = pools.en.alloc(); if (!e) return null;
  e.type = type; e.A = A; e.art = A.art;
  e.maxHP = e.hp = CFG.ENEMY.hp * A.hp * phaseMul('hp');
  e.speed = CFG.ENEMY.speed * A.spd * phaseMul('speed');
  e.rate  = CFG.ENEMY.fireRate * A.rate * phaseMul('fireRate');
  e.bs    = CFG.ENEMY.bulletSpeed * phaseMul('bulletSpeed');
  e.r     = A.art === 'armored' ? 18 : CFG.ENEMY.r;
  e.x = rnd(F.right - 34, F.left + 34);
  e.y = -34 - rnd(60);
  e.cool = rnd(3.4, 1.4);
  e.mode = 'incoming'; e.t = rnd(TAU); e.flap = rnd(TAU);
  e.face = Math.PI;                              // nose-down on entry
  e.orbCx = 0; e.orbCy = 0; e.orbR = 0; e.orbA = 0; e.orbW = 0;
  e.burn = 0; e.hitT = 0; e.burstLeft = 0; e.minion = false;
  e.phaseAt = G.phase;
  return e;
}
function countOrbiters(){
  let n = 0;
  const a = pools.en.active;
  for (let i=0;i<a.length;i++) if (a[i].mode === 'orbiting') n++;
  return n;
}
function toOrbit(e){
  e.mode = 'orbiting';
  e.rate *= CFG.ORBIT_FIRE_MUL;
  e.orbCx = clamp(e.x, F.left + 70, F.right - 70);
  e.orbCy = rnd(F.bottom - 90, F.top + 120);
  e.orbR  = rnd(120, 58);
  e.orbA  = rnd(TAU);
  e.orbW  = (Math.random() < 0.5 ? -1 : 1) * rnd(1.1, 0.5);
}
function updateEnemies(dt){
  const a = pools.en.active;
  for (let i = a.length - 1; i >= 0; i--){
    const e = a[i];
    const fx0 = e.x, fy0 = e.y;                  // for the facing below
    e.t += dt; e.flap += dt * 8; e.hitT = Math.max(0, e.hitT - dt*4);

    if (e.burn > 0){                                  // soul-burn damage over time
      e.burn -= dt;
      e.hp -= P.damage * 0.9 * dt;
      if (Math.random() < dt*14) burst(e.x, e.y, 1, 40, true, 3);
      if (e.hp <= 0){ killEnemy(e, i); continue; }
    }

    if (e.mode === 'incoming'){
      const ai = e.A.ai;
      let vx = 0, vy = e.speed;
      if (ai === 'strafe') vx = Math.sin(e.t * 1.6) * e.speed * 0.9;
      else if (ai === 'weave'){ vx = Math.sin(e.t * 3.0) * e.speed * 1.1; vy = e.speed * 0.85; }
      else if (ai === 'dive'){
        const d = Math.max(1, Math.hypot(P.x-e.x, P.y-e.y));
        vx = (P.x-e.x)/d * e.speed * 1.15;
        vy = Math.max(e.speed*0.5, (P.y-e.y)/d * e.speed * 1.35);
      } else if (ai === 'hover'){
        vx = Math.sin(e.t * 1.1) * e.speed * 0.5;
        vy = e.y < 250 ? e.speed * 0.35 : e.speed * 0.12;   // hangs high and shoots
      }
      e.x = clamp(e.x + vx*dt, F.left - 18, F.right + 18);
      e.y += vy * dt;
      if (e.y > F.bottom + 46) toOrbit(e);
    } else {                                          // orbiting escapee
      e.orbA += e.orbW * dt;
      e.orbCx += Math.sin(e.t*0.7) * 14 * dt;
      e.orbCy += Math.cos(e.t*0.5) * 10 * dt;
      e.orbCx = clamp(e.orbCx, F.left + 60, F.right - 60);
      e.orbCy = clamp(e.orbCy, F.top + 90, F.bottom - 40);
      e.x = e.orbCx + Math.cos(e.orbA) * e.orbR;
      e.y = e.orbCy + Math.sin(e.orbA) * e.orbR * 0.62;
    }

    // Face wherever it actually ended up moving -- measured from the real
    // delta, so field clamping and orbit maths are both accounted for.
    if (dt > 0) faceVelocity(e, (e.x - fx0)/dt, (e.y - fy0)/dt, dt, 9);

    // firing
    if (e.y > 10){
      e.cool -= dt;
      if (e.burstLeft > 0 && e.cool <= 0){
        enemyShoot(e, aimAt(e) + rnd(0.06,-0.06), e.bs);
        e.burstLeft--; e.cool = 0.13;
      } else if (e.cool <= 0){
        const n = e.A.shots || 1, base = aimAt(e);
        for (let k=0;k<n;k++) enemyShoot(e, base + (k - (n-1)/2) * 0.20, e.bs);
        if (e.A.burst) e.burstLeft = e.A.burst - 1;
        e.cool = (1 / e.rate) * rnd(1.35, 0.7);
      }
    }

    // contact
    if (!P.dead && P.inv <= 0 && hit(e.x, e.y, e.r*0.8, P.x, P.y, CFG.PLAYER.r))
      damagePlayer(CFG.ENEMY.contactDmg * enemyDmgMul());
  }
}
function killEnemy(e, i){
  burst(e.x, e.y, 16, 220, false, 6);
  burst(e.x, e.y, 8, 150, true, 4);
  Audio2.SFX.enemyDie();
  pools.en.release(i);
  if (e.minion) return;                 // boss-summoned minions give nothing
  G.kills++;
  addShards(1);
  if (G.kills % 25 === 0) saveGame();
  maybeSpawnLord();
}
/* A lord is owed once kills reach (lordsKilled+1)*100. Comparing with >= ,
   not %, means a milestone crossed during a boss fight is not lost. */
function maybeSpawnLord(){
  if (G.boss) return;
  if (G.kills >= (G.lordsKilled + 1) * CFG.KILLS_PER_PHASE) spawnLord();
}
function damageEnemy(e, i, amount, burnFor){
  e.hp -= amount; e.hitT = 1;
  if (burnFor) e.burn = Math.max(e.burn, burnFor);
  if (e.hp <= 0){ killEnemy(e, i); return true; }
  return false;
}

/* ============================ PROGRESSION ==============================
   1 shard per minor dragon -> 10 shards = 1 soul -> 10 souls = 1 level-up.
   A dragon lord is worth one whole soul.
   ======================================================================== */
/* The three rewards are deliberately three sizes. A shard fires once per kill,
   so it stays a blip and a counter tick -- no shake, no flash, or a long run
   would be unreadable. A soul is ten of those and gets a ring, a flash and a
   nudge of shake. A level is a hundred and takes the screen. */
function addShards(n){
  G.shards += n;
  Audio2.SFX.shard(G.shards);
  G.shardPulse = 1;
  burst(P.x, P.y - 20, 3, 95, true, 4);
  while (G.shards >= CFG.SHARDS_PER_SOUL){ G.shards -= CFG.SHARDS_PER_SOUL; addSouls(1); }
}
function addSouls(n){
  for (let i=0;i<n;i++){
    G.souls++;
    Audio2.SFX.soul();
    G.soulPulse = 1;
    floater(P.x, P.y - 44, 'FIRE SOUL', true);
    ring(P.x, P.y, 16, 135, 0.5, true, 2.5);
    burst(P.x, P.y, 30, 250, true, 7);
    burst(P.x, P.y, 12, 150, false, 5);
    G.shake = Math.max(G.shake, 8);
    G.flash = Math.max(G.flash, 0.32);
    if (G.souls >= CFG.SOULS_PER_LEVEL){ G.souls -= CFG.SOULS_PER_LEVEL; levelUp(); }
  }
}
function levelUp(){
  const hpBefore = P.hp;
  G.level++;
  applyStats(false);
  P.hp = P.maxHP;                       // the card says SOUL RESTORED -- restore it
  const healed = P.maxHP - hpBefore;
  Audio2.SFX.ascend();
  floater(P.x, P.y - 96, 'LEVEL ' + G.level, false);
  if (healed > 1) floater(P.x, P.y - 124, '+' + Math.ceil(healed) + ' HP', true);
  showCard('SOUL RESTORED', 'LEVEL ' + G.level + '  -  FULL HP / DMG / RATE');
  G.flash = 0.9;
  G.shake = Math.max(G.shake, 15);
  G.healFlash = 1;
  G.levelFx = { t:0, dur:0.9 };
  // Three rings at once, staggered by reach and duration, read as a cascade
  // without needing a scheduler.
  ring(P.x, P.y, 18, 150, 0.45, true,  3);
  ring(P.x, P.y, 18, 230, 0.70, false, 2.5);
  ring(P.x, P.y, 18, 320, 0.95, true,  2);
  burst(P.x, P.y, 46, 300, true, 8);
  burst(P.x, P.y, 30, 190, false, 6);
}
function updatePowerTier(){
  let t = 0;
  for (let i=0;i<POWER_TIERS.length;i++) if (G.lordsKilled >= POWER_TIERS[i].at) t = i;
  if (t !== G.powerTier){
    G.powerTier = t;
    showCard('POWER EVOLVED', POWER_TIERS[t].name);
    Audio2.SFX.levelUp();
  }
}

/* ------------------------------- spawner ------------------------------- */
function updateSpawner(dt){
  if (G.boss || G.kills >= CFG.TOTAL_KILLS || P.dead) return;
  if (countOrbiters() >= CFG.ORBIT_CAP) return;          // hold the wave: clear the circlers
  const a = pools.en.active;
  let live = 0;
  for (let i=0;i<a.length;i++) if (!a[i].minion) live++;
  const maxC = CFG.SPAWN.maxConcurrent + (G.phase-1) * CFG.PHASE_STEP.maxConc;
  if (live >= maxC) return;
  G.spawnTimer -= dt;
  if (G.spawnTimer <= 0){
    const pool = PHASES[G.phase-1].pool;
    spawnEnemy(pick(pool));
    if (G.phase >= 8 && live + 2 <= maxC && Math.random() < 0.4){
      const tw = spawnEnemy('twin');                     // paired formation
      if (tw){ tw.x = clamp(tw.x + rnd(90,-90), F.left+30, F.right-30); tw.y -= 40; }
    }
    G.spawnTimer = CFG.SPAWN.interval * phaseMul('spawn') * rnd(1.25, 0.75);
  }
}

/* ============================== BOSSES ================================= */
function spawnLord(){
  const isEanu = G.lordsKilled >= LORDS.length;
  const def = isEanu ? EANU : LORDS[Math.min(G.lordsKilled, LORDS.length-1)];
  G.boss = {
    name:def.name, maxHP:def.hp, hp:def.hp, pats:def.pat, isEanu,
    x:CFG.W/2, y:-140, t:0, r:isEanu ? 60 : 44,
    patIdx:0, patT:0, swT:0, fireT:0.8, spiral:0,
    mode:'enter', dieT:0, hitT:0, flap:0, eanuStage:0, face:Math.PI,
  };
  buildBossSprites(G.boss);
  Audio2.SFX.lordSpawn();
  Audio2.setTrack('boss', G.phase);
  showCard(isEanu ? 'THE DRAGON KING RETURNS' : 'DRAGON LORD', def.name);
  G.shake = 14;
}
function bossPatternList(b){
  if (!b.isEanu) return b.pats;
  const f = b.hp / b.maxHP;
  const stage = f > 0.66 ? 0 : f > 0.33 ? 1 : 2;
  if (stage !== b.eanuStage){                 // phase change announcement
    b.eanuStage = stage; b.patIdx = 0; b.fireT = 0.5;
    showCard('EANU RAGES', stage === 1 ? 'SECOND FORM' : 'FINAL FORM');
    G.shake = 16; G.flash = 0.5; Audio2.SFX.lordSpawn();
  }
  return stage === 0 ? b.pats.slice(0,2) : stage === 1 ? b.pats.slice(0,4) : b.pats;
}
function updateBoss(dt){
  const b = G.boss; if (!b) return;
  b.t += dt; b.flap += dt * 5; b.hitT = Math.max(0, b.hitT - dt*4);

  if (b.mode === 'enter'){
    b.y += 130 * dt;
    if (b.y >= 158){ b.y = 158; b.mode = 'fight'; }
    return;
  }
  if (b.mode === 'dying'){
    b.dieT += dt;
    if (Math.random() < dt*26) burst(b.x + rnd(b.r,-b.r), b.y + rnd(b.r,-b.r), 6, 200, Math.random()<0.5, 6);
    if (b.dieT > 2.1) resolveBoss();
    return;
  }

  const bfx0 = b.x, bfy0 = b.y;                   // for the facing below
  const list = bossPatternList(b);
  b.patT += dt;
  if (b.patT > (b.isEanu ? 5.2 : 6.6)){ b.patT = 0; b.patIdx = (b.patIdx+1) % list.length; b.fireT = 0.35; }
  const pat = list[b.patIdx % list.length];

  // movement
  if (pat === 'charge'){
    b.x = lerp(b.x, P.x, Math.min(1, 1.5*dt));
    b.y = lerp(b.y, clamp(P.y - 240, 130, 430), Math.min(1, 1.1*dt));
  } else {
    b.x = CFG.W/2 + Math.sin(b.t * 0.55) * 158;
    b.y = lerp(b.y, 158 + Math.sin(b.t * 0.85) * 36, Math.min(1, 2.2*dt));
  }

  // A lord is far bigger than a mob, so it only banks into its movement --
  // capped well short of side-on, and it still reads as bearing down on Cindu.
  if (dt > 0) faceVelocity(b, (b.x - bfx0)/dt, (b.y - bfy0)/dt, dt, 5, 0.55);

  // firing
  const spd = 200 * phaseMul('bulletSpeed');
  b.fireT -= dt;
  switch (pat){
    case 'radial':
      if (b.fireT <= 0){
        const n = b.isEanu ? 20 : 12, off = rnd(TAU);
        for (let i=0;i<n;i++) bossShoot(b.x, b.y, off + i*TAU/n, spd*0.82);
        b.fireT = b.isEanu ? 1.5 : 1.95;
      } break;
    case 'sweep':
      b.swT += dt;
      if (b.fireT <= 0){
        bossShoot(b.x, b.y, Math.PI/2 + Math.sin(b.swT*1.05)*0.95, spd);
        b.fireT = b.isEanu ? 0.07 : 0.095;
      } break;
    case 'volley':
      if (b.fireT <= 0){
        const base = Math.atan2(P.y-b.y, P.x-b.x);
        for (let k=-1;k<=1;k++) bossShoot(b.x, b.y, base + k*0.17, spd*1.28);
        b.fireT = b.isEanu ? 0.85 : 1.15;
      } break;
    case 'rings':
      if (b.fireT <= 0){
        const off = rnd(TAU);
        for (let i=0;i<16;i++) bossShoot(b.x, b.y, off + i*TAU/16, spd*0.62);
        b.fireT = b.isEanu ? 1.9 : 2.6;
      } break;
    case 'spiral':
      if (b.fireT <= 0){
        b.spiral += 0.44;
        bossShoot(b.x, b.y, b.spiral, spd*0.78);
        bossShoot(b.x, b.y, b.spiral + Math.PI, spd*0.78);
        b.fireT = b.isEanu ? 0.05 : 0.07;
      } break;
    case 'cross':
      if (b.fireT <= 0){
        b.spiral += 0.20;
        for (let i=0;i<4;i++) bossShoot(b.x, b.y, b.spiral + i*Math.PI/2, spd*0.9);
        b.fireT = 0.19;
      } break;
    case 'charge':
      if (b.fireT <= 0){
        bossShoot(b.x, b.y, Math.atan2(P.y-b.y, P.x-b.x), spd*1.35);
        b.fireT = 0.28;
      } break;
    case 'summon':
      if (b.fireT <= 0){
        for (let i=0;i<3;i++){
          const e = spawnEnemy(pick(PHASES[G.phase-1].pool));
          if (e){ e.minion = true; e.x = clamp(b.x + rnd(110,-110), F.left, F.right); e.y = b.y + 20; }
        }
        b.fireT = 7.5;
      } break;
  }

  if (!P.dead && P.inv <= 0 && hit(b.x, b.y, b.r*0.75, P.x, P.y, CFG.PLAYER.r))
    damagePlayer(CFG.ENEMY.contactDmg * enemyDmgMul() * 1.8);
}
function damageBoss(amount){
  const b = G.boss;
  if (!b || b.mode !== 'fight') return;
  b.hp -= amount; b.hitT = 1;
  if (b.hp <= 0){
    b.hp = 0; b.mode = 'dying'; b.dieT = 0;
    Audio2.SFX.bossWin(); Audio2.stopMusic();
    G.shake = 20; G.flash = 0.8;
    burst(b.x, b.y, 70, 320, false, 9); burst(b.x, b.y, 50, 240, true, 7);
  }
}
function resolveBoss(){
  const wasEanu = G.boss.isEanu;
  G.boss = null;
  // clear leftover boss bullets so the reward moment is calm
  pools.eb.clear();
  if (wasEanu){
    pools.en.clear(); pools.pb.clear();
    G.state = 'victory'; G.endT = 0;
    Audio2.stopMusic(); Audio2.SFX.victory();
    clearSave();
    return;
  }
  G.lordsKilled++;
  addSouls(CFG.LORD_SOUL_BONUS);
  G.phase = clamp(G.lordsKilled + 1, 1, PHASES.length);
  updatePowerTier();
  Audio2.setTrack('triumph', G.phase);
  showCard('PHASE ' + G.phase, PHASES[G.phase-1].name);
  saveGame(true);
}

/* ============================ POWER ATTACK ============================= */
function firePower(){
  const T = currentTier();
  G.powerTimer = 0; G.powerUses++;
  G.powerFx = { kind:T.kind, t:0, dur:T.dur, total:P.damage*T.dmg, T, ring:0 };
  Audio2.SFX.power(G.powerTier);
  G.shake = 13; G.flash = 0.45;
  burst(P.x, P.y - 20, 34, 280, true, 8);
}
function powerHits(fx, x, y, r){
  if (fx.kind === 'nova') return true;
  if (fx.kind === 'beam'){
    if (y > P.y + 30) return fx.T.wave && dist2(x,y,P.x,P.y) < Math.pow(fx.ring + r, 2);
    return Math.abs(x - P.x) < 78 + r;
  }
  // cone
  const dx = x - P.x, dy = y - P.y;
  if (dy > 20) return false;
  const d = Math.hypot(dx, dy);
  if (d > 400) return false;
  return Math.abs(Math.atan2(dx, -dy)) < 0.62;
}
function updatePower(dt){
  const fx = G.powerFx; if (!fx) return;
  fx.t += dt;
  fx.ring = easeOut(clamp(fx.t/fx.dur,0,1)) * 420;
  const frac = Math.min(dt / fx.dur, 1);
  const tick = fx.total * frac;
  const burnFor = fx.T.burn ? 2.6 : 0;
  const es = pools.en.active;
  for (let i = es.length-1; i>=0; i--){
    const e = es[i];
    if (powerHits(fx, e.x, e.y, e.r)) damageEnemy(e, i, tick, burnFor);
  }
  if (G.boss && G.boss.mode === 'fight' && powerHits(fx, G.boss.x, G.boss.y, G.boss.r))
    damageBoss(tick * 0.85);
  if (fx.kind === 'nova'){                       // nova also scrubs enemy fire
    const bs = pools.eb.active;
    for (let i = bs.length-1;i>=0;i--){
      if (dist2(bs[i].x, bs[i].y, P.x, P.y) < fx.ring*fx.ring){ burst(bs[i].x,bs[i].y,2,60,true,3); pools.eb.release(i); }
    }
  }
  if (Math.random() < dt*30) burst(P.x + rnd(50,-50), P.y - rnd(120,0), 2, 120, true, 5);
  if (fx.t >= fx.dur) G.powerFx = null;
}

/* ============================= COLLISIONS ============================== */
function updateBullets(dt){
  const pb = pools.pb.active;
  for (let i = pb.length-1; i>=0; i--){
    const b = pb[i];
    b.x += b.vx*dt; b.y += b.vy*dt;
    // a real fireball sheds embers
    if (b.tier >= 2 && Math.random() < dt * (7 * (b.tier-1)))
      burst(b.x + rnd(3,-3), b.y + b.r, 1, 34, Math.random() < 0.4, 3);
    if (b.y < -24 || b.x < -24 || b.x > CFG.W+24){ pools.pb.release(i); continue; }
    let consumed = false;
    const es = pools.en.active;
    for (let j = es.length-1; j>=0; j--){
      const e = es[j];
      if (hit(b.x, b.y, b.hr, e.x, e.y, e.r)){
        burst(b.x, b.y, 4, 110, false, 3);
        damageEnemy(e, j, b.dmg);
        pools.pb.release(i); consumed = true; break;
      }
    }
    if (consumed) continue;
    const bs = G.boss;
    if (bs && bs.mode === 'fight' && hit(b.x, b.y, b.hr, bs.x, bs.y, bs.r)){
      burst(b.x, b.y, 5, 130, false, 3);
      damageBoss(b.dmg);
      pools.pb.release(i);
    }
  }
  const eb = pools.eb.active;
  for (let i = eb.length-1; i>=0; i--){
    const b = eb[i];
    b.x += b.vx*dt; b.y += b.vy*dt; b.t += dt;
    if (b.y < -30 || b.y > CFG.H+30 || b.x < -30 || b.x > CFG.W+30 || b.t > 9){
      pools.eb.release(i); continue;
    }
    if (!P.dead && P.inv <= 0 && hit(b.x, b.y, b.r, P.x, P.y, CFG.PLAYER.r*0.85)){
      damagePlayer(b.dmg);
      burst(b.x, b.y, 6, 130, true, 4);
      pools.eb.release(i);
    }
  }
}
function updateFx(dt){
  const ps = pools.par.active;
  for (let i = ps.length-1; i>=0; i--){
    const p = ps[i];
    p.life -= dt;
    if (p.life <= 0){ pools.par.release(i); continue; }
    p.x += p.vx*dt; p.y += p.vy*dt;
    p.vx *= 0.94; p.vy = p.vy*0.94 + 60*dt;
  }
  const fs = pools.flo.active;
  for (let i = fs.length-1; i>=0; i--){
    const f = fs[i];
    f.t += dt; f.y -= 34*dt;
    if (f.t > 1.1) pools.flo.release(i);
  }
  const gs = pools.rng.active;
  for (let i = gs.length-1; i>=0; i--){
    const g = gs[i];
    g.t += dt;
    if (g.t >= g.dur) pools.rng.release(i);
  }
  if (G.levelFx){
    G.levelFx.t += dt;
    if (G.levelFx.t >= G.levelFx.dur) G.levelFx = null;
  }
  G.shake = Math.max(0, G.shake - dt*34);
  G.flash = Math.max(0, G.flash - dt*2.4);
  G.shardPulse = Math.max(0, G.shardPulse - dt*3.6);
  G.soulPulse  = Math.max(0, G.soulPulse  - dt*2.2);
  G.healFlash  = Math.max(0, G.healFlash  - dt*1.8);
  if (G.cardT > 0) G.cardT -= dt; else G.card = null;
}

/* ========================== SAVE / CHECKPOINT ========================== */
function snapshot(){
  return { v:1, kills:G.kills, shards:G.shards, souls:G.souls, level:G.level,
           lordsKilled:G.lordsKilled, phase:G.phase, powerTier:G.powerTier,
           powerUses:G.powerUses, hp:Math.round(P.hp) };
}
function readSave(){
  try { const r = JSON.parse(localStorage.getItem(CFG.SAVE_KEY)); return (r && r.v === 1) ? r : null; }
  catch(e){ return null; }
}
function saveGame(atLord){
  const snap = snapshot();
  const rec = readSave() || { v:1 };
  rec.v = 1; rec.resume = snap;
  if (atLord || !rec.checkpoint) rec.checkpoint = snap;
  try { localStorage.setItem(CFG.SAVE_KEY, JSON.stringify(rec)); } catch(e){}
  G.hasSave = true; G.checkpoint = rec.checkpoint;
}
function clearSave(){
  try { localStorage.removeItem(CFG.SAVE_KEY); } catch(e){}
  G.hasSave = false; G.checkpoint = null;
}
function startGame(snap){
  if (!snap) clearSave();            // a new run starts a fresh record
  for (const k in pools) pools[k].clear();
  G.boss = null; G.powerFx = null; G.card = null; G.cardT = 0;
  G.kills = snap ? snap.kills : 0;
  G.shards = snap ? snap.shards : 0;
  G.souls = snap ? snap.souls : 0;
  G.level = snap ? snap.level : 1;
  G.lordsKilled = snap ? snap.lordsKilled : 0;
  G.phase = snap ? clamp(snap.phase, 1, PHASES.length) : 1;
  G.powerTier = 0;
  for (let i=0;i<POWER_TIERS.length;i++)          // derive, don't trust a stale save
    if (G.lordsKilled >= POWER_TIERS[i].at) G.powerTier = i;
  G.powerUses = snap ? (snap.powerUses||0) : 0;
  applyStats(false);
  P.hp = snap ? clamp(snap.hp, 1, P.maxHP) : P.maxHP;
  P.x = CFG.W/2; P.y = F.bottom - 80; P.dead = false; P.inv = 1.4;
  P.cool = 0; P.hurtFlash = 0;
  G.powerTimer = CFG.POWER.cooldown;
  G.spawnTimer = 2.4; G.shake = 0; G.flash = 0; G.endT = 0;
  G.shardPulse = 0; G.soulPulse = 0; G.healFlash = 0; G.levelFx = null;
  IN.powerEdge = false; IN.pauseEdge = false; IN.tap = null; IN.power = false;
  G.state = 'playing';
  Audio2.setTrack('triumph', G.phase);
  showCard('PHASE ' + G.phase, PHASES[G.phase-1].name);
  maybeSpawnLord();          // a run resumed on a lord milestone re-summons it
  saveGame(!snap);           // a new run's start IS its first checkpoint
}
function toggleMute(){
  const on = !(Audio2.opt.music || Audio2.opt.sfx);
  Audio2.setOpt('music', on); Audio2.setOpt('sfx', on);
  if (on) Audio2.SFX.select();
}

/* ============================== DRAWING ================================ */
function txt(s, x, y, size, col, align, weight){
  ctx.font = (weight || '') + size + 'px "Courier New",ui-monospace,monospace';
  ctx.textAlign = align || 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = col || CFG.AMBER;
  ctx.fillText(s, x, y);
}
function glowTxt(s, x, y, size, col, align, blur){
  ctx.save();
  ctx.shadowColor = col || CFG.AMBER; ctx.shadowBlur = blur === undefined ? 12 : blur;
  txt(s, x, y, size, col, align, 'bold ');
  ctx.shadowBlur = 0;
  txt(s, x, y, size, col, align, 'bold ');
  ctx.restore();
}
function bar(x, y, w, h, frac, col, bg){
  ctx.strokeStyle = bg || amber(0.30); ctx.lineWidth = 1.2;
  ctx.strokeRect(x, y, w, h);
  const f = clamp(frac, 0, 1);
  if (f > 0){
    ctx.fillStyle = col;
    ctx.fillRect(x+1.5, y+1.5, Math.max(0,(w-3)*f), h-3);
  }
}

function drawEnemies(){
  const a = pools.en.active;
  for (let i=0;i<a.length;i++){
    const e = a[i];
    const fr = ((e.flap|0) % 3 + 3) % 3;
    blit(SPR[e.art][fr], e.x, e.y, e.face, e.mode === 'orbiting' ? 0.94 : 1);
    if (e.burn > 0){
      ctx.strokeStyle = purple(0.35 + 0.25*Math.sin(G.t*24)); ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 6, 0, TAU); ctx.stroke();
    }
    if (e.hitT > 0){
      ctx.strokeStyle = purple(e.hitT * 0.9); ctx.lineWidth = 2.4;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 4, 0, TAU); ctx.stroke();
    }
    if (e.maxHP > CFG.ENEMY.hp * 1.4 && e.hp < e.maxHP){       // tough enemies show HP
      bar(e.x-16, e.y + e.r + 8, 32, 3, e.hp/e.maxHP, CFG.PURPLE, amber(0.25));
    }
  }
}
function buildBossSprites(b){
  const s = b.isEanu ? 54 : 40;
  const half = spriteHalf({ s, span:1.16, tail:1.40, pb:18 });
  b.spr = [0,1,2].map(i => makeSprite(half, x => glowStroke(x,
    xx => dragonPath(xx, s, [0.2,0.6,0.95][i], { span:1.16, crown:true, ridge:b.isEanu }),
    { lw:1.6, lwMid:2.2, lwOuter:3.2, pb:18, ab:9 })));
  b.spr.forEach(c => dragonEyes(c.getContext('2d'), s));
}
function drawBoss(){
  const b = G.boss; if (!b) return;
  if (!b.spr) buildBossSprites(b);      // fallback if a boss was restored
  const fr = ((b.flap|0) % 3 + 3) % 3;
  const dyingScale = b.mode === 'dying' ? 1 + b.dieT*0.14 : 1;
  const alpha = b.mode === 'dying' ? clamp(1 - b.dieT/2.1, 0, 1) : 1;
  blit(b.spr[fr], b.x, b.y, b.face, alpha, dyingScale);
  if (b.hitT > 0){
    ctx.strokeStyle = purple(b.hitT*0.85); ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 8, 0, TAU); ctx.stroke();
  }
}
function drawPlayer(){
  if (P.dead) return;
  const fr = ((P.flap|0) % 3 + 3) % 3;
  const blink = P.inv > 0 && (Math.floor(P.inv*18) % 2 === 0);
  blit(SPR.cindu[fr], P.x, P.y, 0, blink ? 0.4 : 1);
  if (P.hurtFlash > 0){
    ctx.strokeStyle = purple(P.hurtFlash); ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(P.x, P.y, 26, 0, TAU); ctx.stroke();
  }
  if (powerReady()){
    const pulse = 0.35 + 0.3*Math.sin(G.t*5);
    blit(SPR.core, P.x, P.y, 0, pulse);
  }
  // SPR.core was built for the level-up flash and until now only ever drew the
  // power-ready pulse. On a level it blows off Cindu and fades.
  if (G.levelFx){
    const k = clamp(G.levelFx.t / G.levelFx.dur, 0, 1);
    blit(SPR.core, P.x, P.y, 0, (1-k)*0.9, 1 + easeOut(k)*4.5);
  }
}
/* Cindu's breath by tier: 0 a thin bolt, 4 a roaring fireball. Everything
   stays stroke-and-glow so it sits inside the game's neon look. */
function drawFlame(b){
  const T = b.tier | 0;
  const f = Math.sin(b.seed + G.t * 34);            // flicker, per bullet
  const R = b.r * (1 + T * 0.34) * (1 + f * 0.05);  // visual radius only

  if (T === 0){                                     // the original bolt
    ctx.strokeStyle = CFG.AMBER; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(b.x, b.y - b.r*2.1); ctx.lineTo(b.x, b.y + b.r*1.5); ctx.stroke();
    ctx.strokeStyle = purple(0.85); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(b.x, b.y - b.r*1.1); ctx.lineTo(b.x, b.y + b.r*0.7); ctx.stroke();
    return;
  }

  ctx.save();
  ctx.translate(b.x, b.y);
  ctx.shadowColor = CFG.AMBER; ctx.shadowBlur = 5 + T * 5;

  // Roundness rises with the tier: a lean teardrop becomes a ball of fire.
  const q = T / 4;
  const nose = R * lerp(1.70, 1.05, q);        // how far the point leads
  const bulge = R * lerp(0.92, 1.42, q);       // how fat the sides are
  const back = R * lerp(1.15, 1.30, q);

  // tail: wisps of flame torn off the back, shorter as the head grows fatter
  const tail = back + R * lerp(1.5, 0.9, q);
  ctx.strokeStyle = amber(0.45 + T*0.07); ctx.lineWidth = 1 + T*0.3;
  for (let k = -1; k <= 1; k += 2){
    ctx.beginPath();
    ctx.moveTo(k * bulge * 0.5, back * 0.75);
    ctx.quadraticCurveTo(k * bulge * (0.75 + f*0.22), tail * 0.9, k * R * 0.12, tail);
    ctx.stroke();
  }

  // Each half is one cubic. At q=1 the handles sit at 4/3 of the radius,
  // which is the standard cubic approximation of a semicircle -- so the
  // teardrop's point rounds off into a ball as Cindu's damage climbs.
  const cx1 = bulge * lerp(1.15, 1.33, q), cy1 = -nose * lerp(0.42, 1.00, q);
  const cx2 = bulge * lerp(1.00, 1.33, q), cy2 =  back * lerp(0.72, 1.00, q);
  ctx.strokeStyle = CFG.AMBER; ctx.lineWidth = 1.6 + T * 0.3;
  ctx.beginPath();
  ctx.moveTo(0, -nose);
  ctx.bezierCurveTo( cx1, cy1,  cx2, cy2, 0, back);
  ctx.bezierCurveTo(-cx2, cy2, -cx1, cy1, 0, -nose);
  ctx.stroke();

  // corona: only once the flame is genuinely a fireball
  if (T >= 3){
    ctx.strokeStyle = amber(0.30 + 0.12*f);
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(0, 0, bulge * (1.35 + 0.07*f), 0, TAU); ctx.stroke();
  }
  if (T >= 4){
    ctx.strokeStyle = amber(0.16);
    ctx.beginPath(); ctx.arc(0, 0, bulge * (1.72 - 0.09*f), 0, TAU); ctx.stroke();
    for (let k = 0; k < 5; k++){                    // jagged licks off the ball
      const a = b.seed + k * TAU/5 + G.t * 2.2;
      const r0 = bulge * 1.05, r1 = bulge * (1.5 + 0.33*Math.sin(b.seed + k*2.1 + G.t*17));
      ctx.beginPath();
      ctx.moveTo(Math.cos(a)*r0, Math.sin(a)*r0);
      ctx.lineTo(Math.cos(a)*r1, Math.sin(a)*r1);
      ctx.stroke();
    }
  }

  // soul-core: the hot purple centre, brighter the stronger Cindu gets
  ctx.shadowColor = CFG.PURPLE; ctx.shadowBlur = 4 + T * 4;
  ctx.strokeStyle = purple(0.6 + T * 0.09);
  ctx.lineWidth = 1 + T * 0.4;
  ctx.beginPath(); ctx.arc(0, 0, R * (0.38 + 0.05*f), 0, TAU); ctx.stroke();
  ctx.restore();
}
function drawBullets(){
  const pb = pools.pb.active;
  for (let i=0;i<pb.length;i++) drawFlame(pb[i]);
  const eb = pools.eb.active;
  ctx.lineWidth = 1.6;
  for (let i=0;i<eb.length;i++){
    const b = eb[i];
    ctx.strokeStyle = CFG.PURPLE;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.stroke();
    ctx.strokeStyle = amber(0.55);
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r*0.42, 0, TAU); ctx.stroke();
  }
}
function drawParticles(){
  const gs = pools.rng.active;
  for (let i=0;i<gs.length;i++){
    const g = gs[i];
    const k = clamp(g.t / g.dur, 0, 1), a = 1 - k;
    ctx.strokeStyle = g.pur ? purple(a*0.9) : amber(a*0.85);
    ctx.lineWidth = g.w * (0.4 + a*0.6);
    ctx.beginPath();
    ctx.arc(g.x, g.y, lerp(g.r0, g.r1, easeOut(k)), 0, TAU);
    ctx.stroke();
  }
  const ps = pools.par.active;
  for (let i=0;i<ps.length;i++){
    const p = ps[i];
    const a = clamp(p.life / p.max, 0, 1);
    const sp = Math.hypot(p.vx, p.vy) || 1;
    ctx.strokeStyle = p.pur ? purple(a*0.9) : amber(a*0.9);
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(p.x - p.vx/sp*p.len*a, p.y - p.vy/sp*p.len*a);
    ctx.stroke();
  }
  const fs = pools.flo.active;
  for (let i=0;i<fs.length;i++){
    const f = fs[i];
    const a = clamp(1 - f.t/1.1, 0, 1);
    txt(f.txt, f.x, f.y, 13, f.pur ? purple(a) : amber(a), 'center', 'bold ');
  }
}
function drawPowerFx(){
  const fx = G.powerFx; if (!fx) return;
  const k = clamp(fx.t / fx.dur, 0, 1), a = 1 - k*k;
  ctx.save();
  ctx.lineWidth = 2;
  if (fx.kind === 'cone'){
    const reach = 400 * easeOut(k);
    for (let i=0;i<5;i++){
      const sp = 0.62 * (0.35 + i*0.17);
      ctx.strokeStyle = i % 2 ? purple(a*0.75) : amber(a*0.9);
      ctx.beginPath();
      ctx.moveTo(P.x, P.y - 16);
      ctx.lineTo(P.x + Math.sin(sp)*reach,  P.y - Math.cos(sp)*reach);
      ctx.moveTo(P.x, P.y - 16);
      ctx.lineTo(P.x - Math.sin(sp)*reach,  P.y - Math.cos(sp)*reach);
      ctx.stroke();
    }
    ctx.strokeStyle = purple(a*0.6);
    ctx.beginPath(); ctx.arc(P.x, P.y - 16, reach, -Math.PI/2 - 0.62, -Math.PI/2 + 0.62); ctx.stroke();
  } else if (fx.kind === 'beam'){
    const w = 78 * (0.6 + 0.4*Math.sin(k*Math.PI));
    ctx.strokeStyle = amber(a);
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(P.x-w, P.y-10); ctx.lineTo(P.x-w, -20);
                     ctx.moveTo(P.x+w, P.y-10); ctx.lineTo(P.x+w, -20); ctx.stroke();
    ctx.strokeStyle = purple(a*0.8); ctx.lineWidth = 2;
    for (let i=-2;i<=2;i++){
      const x = P.x + i*w*0.42 + Math.sin(G.t*22 + i)*4;
      ctx.beginPath(); ctx.moveTo(x, P.y-14); ctx.lineTo(x, -20); ctx.stroke();
    }
    if (fx.T.wave){
      ctx.strokeStyle = purple(a*0.85); ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(P.x, P.y, fx.ring, 0, TAU); ctx.stroke();
    }
  } else {  // nova
    ctx.strokeStyle = purple(a); ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(P.x, P.y, fx.ring, 0, TAU); ctx.stroke();
    ctx.strokeStyle = amber(a*0.9); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(P.x, P.y, fx.ring*0.72, 0, TAU); ctx.stroke();
    ctx.beginPath(); ctx.arc(P.x, P.y, fx.ring*0.44, 0, TAU); ctx.stroke();
    ctx.fillStyle = purple(a*0.10);
    ctx.fillRect(0, 0, CFG.W, CFG.H);
    ctx.strokeStyle = amber(a*0.55); ctx.lineWidth = 1.4;
    for (let i=0;i<16;i++){
      const ang = i*TAU/16 + G.t*0.6;
      ctx.beginPath();
      ctx.moveTo(P.x + Math.cos(ang)*fx.ring*0.5, P.y + Math.sin(ang)*fx.ring*0.5);
      ctx.lineTo(P.x + Math.cos(ang)*fx.ring, P.y + Math.sin(ang)*fx.ring);
      ctx.stroke();
    }
  }
  ctx.restore();
}

function drawHUD(){
  // health
  const hpFrac = P.hp / P.maxHP;
  txt('HP', 14, 18, 12, amber(0.7), 'left');
  bar(38, 11, 176, 15, hpFrac, hpFrac > CFG.POWER.hpGate ? CFG.AMBER : CFG.PURPLE);
  if (G.healFlash > 0.01){                       // the bar snapping to full, made legible
    ctx.fillStyle = purple(G.healFlash * 0.75);
    ctx.fillRect(39.5, 12.5, 173 * hpFrac, 12);
    ctx.strokeStyle = purple(G.healFlash); ctx.lineWidth = 1.6;
    ctx.strokeRect(38, 11, 176, 15);
  }
  txt(Math.ceil(P.hp) + '/' + P.maxHP, 222, 18, 11, amber(0.65), 'left');
  txt('PH ' + G.phase + '/' + PHASES.length + '   LV ' + G.level,
      CFG.W-14, 18, 13, CFG.AMBER, 'right', 'bold ');
  // counters
  txt('DRAGONS ' + String(G.kills).padStart(4,'0') + '/' + CFG.TOTAL_KILLS, 14, 40, 12, amber(0.85), 'left');
  // Split so a shard tick and a soul tick can pulse independently.
  const sp = G.shardPulse, sl = G.soulPulse;
  txt('SOUL ' + G.souls + '/10', CFG.W-14, 40, 12 + 3*sl, purple(0.95), 'right', sl > 0.05 ? 'bold ' : '');
  txt('SHARD ' + G.shards + '/10', CFG.W-116, 40, 12 + 2.5*sp, purple(0.72 + 0.28*sp), 'right',
      sp > 0.05 ? 'bold ' : '');
  // power readiness: two separate lights, so a denied press is never a mystery
  const cd = clamp(G.powerTimer / CFG.POWER.cooldown, 0, 1);
  const hpOK = P.hp >= P.maxHP * CFG.POWER.hpGate;
  txt('PWR', 14, 62, 11, amber(0.7), 'left');
  bar(42, 56, 96, 11, cd, cd >= 1 ? CFG.PURPLE : purple(0.55));
  txt(cd >= 1 ? 'READY' : Math.ceil((1-cd)*CFG.POWER.cooldown) + 's',
      144, 62, 11, cd >= 1 ? CFG.PURPLE : amber(0.5), 'left');
  txt(hpOK ? 'HP OK' : 'HP LOW', 200, 62, 11, hpOK ? CFG.PURPLE : amber(0.45), 'left');
  txt(currentTier().name, CFG.W-14, 62, 11, powerReady() ? CFG.PURPLE : amber(0.45), 'right');

  if (G.boss){
    const b = G.boss;
    glowTxt(b.name, CFG.W/2, 84, 13, b.isEanu ? CFG.PURPLE : CFG.AMBER, 'center', 8);
    bar(60, 94, CFG.W-120, 9, b.hp/b.maxHP, b.isEanu ? CFG.PURPLE : CFG.AMBER, amber(0.4));
  }
  if (countOrbiters() >= CFG.ORBIT_CAP)
    txt('SKIES CHOKED - CLEAR THE CIRCLERS', CFG.W/2, 118, 12, purple(0.7 + 0.3*Math.sin(G.t*6)));
}
function drawCard(){
  if (!G.card) return;
  const a = clamp(G.cardT > 2.2 ? (2.6-G.cardT)/0.4 : Math.min(1, G.cardT/0.6), 0, 1);
  ctx.save(); ctx.globalAlpha = a;
  glowTxt(G.card.txt, CFG.W/2, CFG.H*0.34, 26, CFG.AMBER, 'center', 16);
  if (G.card.sub) glowTxt(G.card.sub, CFG.W/2, CFG.H*0.34 + 30, 14, CFG.PURPLE, 'center', 10);
  ctx.restore();
}

/* ============================== SCREENS ================================ */
const MENU = { items:[], rects:[] };
function drawMenu(items, y0, gap){
  MENU.items = items; MENU.rects = [];
  G.menuIdx = clamp(G.menuIdx, 0, items.length-1);
  const w = 320, x = CFG.W/2 - w/2;
  for (let i=0;i<items.length;i++){
    const y = y0 + i*gap, sel = i === G.menuIdx;
    MENU.rects.push({ x, y:y-23, w, h:46 });
    ctx.lineWidth = sel ? 2 : 1;
    ctx.strokeStyle = sel ? CFG.AMBER : amber(0.26);
    ctx.strokeRect(x, y-23, w, 46);
    if (sel){
      ctx.strokeStyle = purple(0.55 + 0.35*Math.sin(G.t*5)); ctx.lineWidth = 1.4;
      ctx.strokeRect(x-5, y-28, w+10, 56);
    }
    txt(items[i], CFG.W/2, y, 15, sel ? CFG.AMBER : amber(0.62), 'center', sel ? 'bold ' : '');
  }
}
function menuInput(onSelect){
  const t = takeTap();
  if (!t) return;
  if (t.key !== undefined){
    const k = t.key, n = MENU.items.length || 1;
    if (k === 'arrowup' || k === 'w'){ G.menuIdx = (G.menuIdx-1+n)%n; Audio2.SFX.select(); }
    else if (k === 'arrowdown' || k === 's'){ G.menuIdx = (G.menuIdx+1)%n; Audio2.SFX.select(); }
    else if (k === 'enter' || k === ' '){ Audio2.SFX.select(); onSelect(G.menuIdx); }
    return;
  }
  for (let i=0;i<MENU.rects.length;i++){
    const r = MENU.rects[i];
    if (t.x >= r.x && t.x <= r.x+r.w && t.y >= r.y && t.y <= r.y+r.h){
      G.menuIdx = i; Audio2.SFX.select(); onSelect(i); return;
    }
  }
}
const soundLabel = () => 'SOUND: ' + (Audio2.opt.music || Audio2.opt.sfx ? 'ON' : 'OFF');
function titleItems(){
  const it = ['NEW RUN'];
  if (G.hasSave) it.push('CONTINUE');
  it.push('THE TALE', soundLabel());
  return it;
}

/* ------------------------------- title --------------------------------- */
let titleDragonY = 322;
function drawTitle(){
  drawSky();
  titleDragonY -= 0.45;
  if (titleDragonY < 252) titleDragonY = 322;
  blit(SPR.cindu[((G.t*7)|0)%3], CFG.W/2, titleDragonY, 0, 0.20, 1.2);
  glowTxt('C I N D U', CFG.W/2, 150, 44, CFG.AMBER, 'center', 22);
  glowTxt('DRAGON LORD', CFG.W/2, 196, 20, CFG.PURPLE, 'center', 14);
  txt('RECLAIM THE SCATTERED SOUL', CFG.W/2, 232, 12, amber(0.55));
  drawMenu(titleItems(), 400, 62);
  const help = showPad()
    ? 'STICK TO FLY   -   FIRE / POWER PADS'
    : 'WASD OR ARROWS   -   SPACE FIRE   -   ENTER POWER';
  txt(help, CFG.W/2, CFG.H-92, 11, amber(0.42));
  txt('P PAUSE   -   M MUTE', CFG.W/2, CFG.H-70, 11, amber(0.28));
}
function updateTitle(){
  menuInput(i => {
    const items = titleItems();
    const label = items[i];
    if (label === 'NEW RUN'){ G.storyNext = 'game'; G.state = 'story'; G.storyT = 0; }
    else if (label === 'CONTINUE'){
      const rec = readSave();
      startGame(rec && rec.resume ? rec.resume : null);
    }
    else if (label === 'THE TALE'){ G.storyNext = 'title'; G.state = 'story'; G.storyT = 0; }
    else { toggleMute(); }
  });
}

/* ------------------------------- story --------------------------------- */
function drawStory(){
  drawSky();
  const lead = 26, top = 250 - G.storyT * 22;
  for (let i=0;i<STORY.length;i++){
    const y = top + i*lead;
    if (y < 60 || y > CFG.H-140) continue;
    const a = clamp(Math.min((y-60)/70, (CFG.H-140-y)/70), 0, 1);
    txt(STORY[i], CFG.W/2, y, i === 0 ? 16 : 13,
        i === 0 ? amber(a) : (i > 11 ? purple(a) : amber(a*0.8)));
  }
  txt(G.storyNext === 'game' ? 'TAP / PRESS TO BEGIN' : 'TAP / PRESS TO RETURN',
      CFG.W/2, CFG.H-96, 12, amber(0.4 + 0.3*Math.sin(G.t*3)));
}
function updateStory(dt){
  G.storyT += dt;
  const done = G.storyT > (STORY.length*26 + 300)/22;
  if (takeTap() || done){
    if (G.storyNext === 'game') startGame(null);
    else { G.state = 'title'; G.menuIdx = 0; }
  }
}

/* ------------------------------- pause --------------------------------- */
function drawPause(){
  ctx.fillStyle = 'rgba(0,0,0,0.78)'; ctx.fillRect(0,0,CFG.W,CFG.H);
  glowTxt('PAUSED', CFG.W/2, 250, 30, CFG.AMBER, 'center', 16);
  txt('DRAGONS SLAIN ' + G.kills + ' / ' + CFG.TOTAL_KILLS, CFG.W/2, 300, 13, amber(0.7));
  txt('LORDS FELLED ' + G.lordsKilled + '   -   LEVEL ' + G.level, CFG.W/2, 324, 13, purple(0.8));
  drawMenu(['RESUME', soundLabel(), 'ABANDON RUN'], 430, 62);
}
function updatePause(){
  if (takePauseEdge()){ resumePlay(); return; }
  menuInput(i => {
    if (i === 0) resumePlay();
    else if (i === 1) toggleMute();
    else { saveGame(false); G.state = 'title'; G.menuIdx = 0; Audio2.stopMusic(); }
  });
}
function resumePlay(){ G.state = 'playing'; G.menuIdx = 0; Audio2.setTrack(G.boss ? 'boss' : 'triumph', G.phase); }

/* ----------------------------- game over ------------------------------- */
function deadItems(){
  const it = [];
  if (G.checkpoint) it.push('RETRY FROM CHECKPOINT');
  it.push('NEW RUN', 'TITLE');
  return it;
}
function drawDead(){
  ctx.fillStyle = 'rgba(0,0,0,' + clamp(G.endT*0.6, 0, 0.82) + ')';
  ctx.fillRect(0,0,CFG.W,CFG.H);
  if (G.endT < 0.6) return;
  glowTxt('CINDU FALLS', CFG.W/2, 240, 30, CFG.PURPLE, 'center', 18);
  txt('THE SOUL SCATTERS AGAIN', CFG.W/2, 278, 13, amber(0.6));
  txt('DRAGONS SLAIN   ' + G.kills, CFG.W/2, 330, 13, amber(0.85));
  txt('LORDS FELLED    ' + G.lordsKilled, CFG.W/2, 352, 13, amber(0.85));
  txt('LEVEL REACHED   ' + G.level, CFG.W/2, 374, 13, amber(0.85));
  if (G.checkpoint)
    txt('CHECKPOINT: ' + G.checkpoint.kills + ' DRAGONS', CFG.W/2, 404, 12, purple(0.8));
  drawMenu(deadItems(), 470, 60);
}
function updateDead(dt){
  G.endT += dt;
  if (G.endT < 0.9){ takeTap(); return; }
  menuInput(i => {
    const label = deadItems()[i];
    if (label === 'RETRY FROM CHECKPOINT') startGame(G.checkpoint);
    else if (label === 'NEW RUN'){ clearSave(); startGame(null); }
    else { G.state = 'title'; G.menuIdx = 0; }
  });
}

/* ------------------------------ victory -------------------------------- */
const ENDING = [
  'EANU FALLS.',
  '',
  'THE LAST SHARD RETURNS,',
  'AND THE SOUL IS WHOLE.',
  '',
  'GAMUUT SAVED A BODY.',
  'CINDU SAVED A KING.',
  '',
  'THE THRONE IS RECLAIMED.',
];
function drawVictory(){
  ctx.fillStyle = 'rgba(0,0,0,' + clamp(G.endT*0.5, 0, 0.85) + ')';
  ctx.fillRect(0,0,CFG.W,CFG.H);
  glowTxt('THE DRAGON KING', CFG.W/2, 150, 26, CFG.AMBER, 'center', 20);
  blit(SPR.cindu[((G.t*6)|0)%3], CFG.W/2, 250, 0, 0.9, 1.8);
  for (let i=0;i<ENDING.length;i++){
    const a = clamp(G.endT*1.4 - i*0.35, 0, 1);
    txt(ENDING[i], CFG.W/2, 350 + i*22, 13, i > 5 ? purple(a) : amber(a*0.9));
  }
  txt('LEVEL ' + G.level + '   -   POWER: ' + currentTier().name + '   -   ' + G.powerUses + ' POWER ATTACKS',
      CFG.W/2, 590, 11, amber(0.6));
  if (G.endT > 3) drawMenu(['PLAY AGAIN', 'TITLE'], 660, 60);
}
function updateVictory(dt){
  G.endT += dt;
  if (G.endT < 3){ takeTap(); return; }
  menuInput(i => { if (i === 0) startGame(null); else { G.state = 'title'; G.menuIdx = 0; } });
}

/* ============================== MAIN LOOP ============================== */
function step(dt){
  G.t += dt;
  switch (G.state){
    case 'title':   updateSky(dt, 0.5); updateTitle(); break;
    case 'story':   updateSky(dt, 0.35); updateStory(dt); break;
    case 'paused':  updatePause(); break;
    case 'dead':    updateSky(dt, 0.25); updateFx(dt); updateDead(dt); break;
    case 'victory': updateSky(dt, 0.4); updateFx(dt); updateVictory(dt); break;
    case 'playing':
      if (takePauseEdge()){ G.state = 'paused'; G.menuIdx = 0; Audio2.stopMusic(); break; }
      updateSky(dt, 1);
      updatePlayer(dt);
      updateEnemies(dt);
      updateBoss(dt);
      updateSpawner(dt);
      updateBullets(dt);
      updatePower(dt);
      updateFx(dt);
      IN.tap = null;
      break;
  }
}
function render(){
  ctx.fillStyle = CFG.BG;
  ctx.fillRect(0, 0, CFG.W, CFG.H);
  const inGame = G.state === 'playing' || G.state === 'paused' ||
                 G.state === 'dead' || G.state === 'victory';
  ctx.save();
  if (G.shake > 0.2) ctx.translate(rnd(G.shake,-G.shake)*0.5, rnd(G.shake,-G.shake)*0.5);
  if (inGame){
    drawSky();
    drawEnemies();
    drawBoss();
    drawPowerFx();
    drawBullets();
    drawPlayer();
    drawParticles();
  } else if (G.state === 'title') drawTitle();
  else if (G.state === 'story')  drawStory();
  ctx.restore();

  if (G.flash > 0.01){
    ctx.fillStyle = purple(clamp(G.flash,0,1) * 0.28);
    ctx.fillRect(0, 0, CFG.W, CFG.H);
  }
  if (inGame && G.state !== 'victory'){ drawHUD(); drawCard(); }
  if (G.state === 'playing') drawPad();
  if (G.state === 'paused')  drawPause();
  if (G.state === 'dead')    drawDead();
  if (G.state === 'victory') drawVictory();
}

const STEP = 1/60;
let lastT = 0, acc = 0;
function frame(now){
  requestAnimationFrame(frame);
  if (!lastT) lastT = now;
  let dt = (now - lastT) / 1000;
  lastT = now;
  if (dt > 0.1) dt = 0.1;              // a backgrounded tab must not spiral
  acc += dt;
  let guard = 0;
  while (acc >= STEP && guard++ < 5){ step(STEP); acc -= STEP; }
  const t0 = performance.now();
  render();
  G.frameMs = G.frameMs * 0.92 + (performance.now() - t0) * 0.08;
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden && G.state === 'playing'){
    G.state = 'paused'; G.menuIdx = 0; Audio2.stopMusic();
  }
});

/* ================================ BOOT ================================= */
buildSprites();
buildWind();
resize();
(function loadSave(){
  const rec = readSave();
  G.hasSave = !!(rec && rec.resume);
  G.checkpoint = rec ? rec.checkpoint : null;
})();
applyStats(false);
requestAnimationFrame(frame);

// Debug hook used by the automated playtests.
window.__CINDU = {
  G, P, pools, CFG, SPR, blit, ctx, IN, PHASES, LORDS, EANU, POWER_TIERS,
  start: startGame,
  jump(kills, level){                       // fast-forward a run
    G.kills = kills;
    G.lordsKilled = Math.floor(kills / CFG.KILLS_PER_PHASE);
    G.phase = clamp(G.lordsKilled + 1, 1, PHASES.length);
    G.level = level || (1 + Math.floor((kills/10 + G.lordsKilled) / 10));
    updatePowerTier(); applyStats(false); P.hp = P.maxHP;
  },
  summon: spawnLord,
  spawn: spawnEnemy, ARCHETYPES, fireTier,
  power(){ G.powerTimer = CFG.POWER.cooldown; P.hp = P.maxHP; firePower(); },
  stats(){ return { state:G.state, kills:G.kills, level:G.level, phase:G.phase,
                    lords:G.lordsKilled, tier:G.powerTier, hp:P.hp, maxHP:P.maxHP,
                    enemies:pools.en.active.length, eb:pools.eb.active.length,
                    frameMs:+G.frameMs.toFixed(2) }; },
};
</script>
