"use strict";
/* =========================================================================
   CINDU: DRAGON LORD
   A single-file vertical-scrolling dragon shooter.
   Sections: CONFIG / UTIL / AUDIO / SPRITES / INPUT / ENTITIES /
             PROGRESSION / BOSSES / POWER / HUD / SCREENS / LOOP
   ========================================================================= */

/* ============================== CONFIG ================================== */
const CFG = {
  W: 540, H: 960,                     // virtual resolution (9:16)
  BG:'#000000', AMBER:'#FFB000', PURPLE:'#B026FF',

  FIELD: { top: 92, bottom: 760, left: 26, right: 514 },   // Cindu's flight box

  // Parallax backdrop. Two layers off one tile; the wind streaks are the third.
  // maxAlpha is a hard ceiling -- the art is swappable and the code cannot
  // inspect it, so an over-bright drop-in stays subdued instead of washing out
  // the amber/purple gameplay layer.
  SKY: { farSpeed:26, midSpeed:62, farAlpha:0.16, midAlpha:0.30,
         farScale:1.15, maxAlpha:0.34 },

  PLAYER: { maxHP:100, damage:10, fireRate:2.5, speed:400, r:15,
            bulletSpeed:780, bulletR:5, iframes:0.85, hitSlop:2 },

  SOULS_PER_LEVEL: 10,
  LORD_SOUL_BONUS: 1,                            // a lord = 1 whole soul

  // One step applied at each dragon-lord kill. Difficulty is a staircase.

                spawn:0.92, maxConc:0.7 },

           contactDmg:9, bulletDmg:7 },

  SPAWN: { interval:1.55, maxConcurrent:5 },

  ORBIT_CAP: 10,          // max simultaneous circling escapees
  ORBIT_FIRE_MUL: 0.6,    // circlers are worn down and fire slower
  POWER: { cooldown:30, hpGate:0.5 },

  POOL: { pBullets:220, eBullets:420, enemies:48, particles:700, floaters:24, rings:16 },

  SAVE_KEY: 'cindu_dragon_lord_save_v1',
  OPT_KEY:  'cindu_dragon_lord_opts_v1',

// Enemy archetypes. `art` picks the pre-rendered sprite; `ai` picks behaviour.
const ARCHETYPES = {

  strafer : { art:'swift',   ai:'strafe', hp:0.85, spd:1.25, rate:1.00, shots:1 },
  weaver  : { art:'swift',   ai:'weave',  hp:0.90, spd:1.15, rate:0.90, shots:1 },
  spreader: { art:'caster',  ai:'drift',  hp:1.10, spd:0.85, rate:0.80, shots:3 },
  diver   : { art:'swift',   ai:'dive',   hp:0.80, spd:1.45, rate:0.55, shots:1 },

// What each phase can spawn, and its name for the transition card.
const PHASES = [

// Nine dragon lords, then Eanu.
const LORDS = [

const EANU = { name:'EANU THE DRAGON KING', hp:5200,
               pat:['radial','sweep','volley','spiral','rings','cross'] };

// Power attack tiers. Unlocked by cumulative dragon-lord kills.
const POWER_TIERS = [
  { at:0, name:'FIRE CONE',    kind:'cone',  dmg:4.5, dur:0.55 },
  { at:2, name:'SOUL BURN',    kind:'cone',  dmg:5.5, dur:0.70, burn:true },
  { at:4, name:'SOUL LANCE',   kind:'beam',  dmg:7.0, dur:0.85, burn:true },
  { at:6, name:'RUIN WAVE',    kind:'beam',  dmg:8.5, dur:1.00, burn:true, wave:true },
  { at:8, name:'KING’S NOVA', kind:'nova', dmg:11.0, dur:1.60, burn:true, wave:true },

const STORY = [
  'CINDU WAS THE DRAGON KING.',
  '',
  'EANU AND HIS FOLLOWERS FELL UPON HIM,',
  'NEARLY SLEW HIM, AND TORE HIS SOUL',

/* =============================== UTIL =================================== */
const TAU = Math.PI * 2;
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const lerp  = (a,b,t) => a + (b-a)*t;
const rnd   = (a=1,b=0) => b + Math.random()*(a-b);
const rndi  = (a,b) => Math.floor(rnd(b+1,a));
const pick  = arr => arr[(Math.random()*arr.length)|0];
const dist2 = (ax,ay,bx,by) => { const dx=ax-bx, dy=ay-by; return dx*dx+dy*dy; };
const hit   = (ax,ay,ar,bx,by,br) => dist2(ax,ay,bx,by) <= (ar+br)*(ar+br);
const easeOut = t => 1 - (1-t)*(1-t);
const wrapPi = a => { let d = (a + Math.PI) % TAU; if (d < 0) d += TAU; return d - Math.PI; };

/* Dragons are drawn nose-up, so rotation 0 points along -Y. A heading of
   (vx,vy) therefore needs atan2(vy,vx) + PI/2 -- straight down comes out at
   PI, which is exactly how every mob used to be pinned. */
const headingRot = (vx, vy) => Math.atan2(vy, vx) + Math.PI/2;
const angTo = (a, b, k) => a + wrapPi(b - a) * k;

/** Turn `o.face` toward the direction it is actually travelling. */
function faceVelocity(o, vx, vy, dt, turn, limit){
  if (Math.hypot(vx, vy) < 6) return;          // too slow to read a heading
  let want = headingRot(vx, vy);
  if (limit) want = Math.PI + clamp(wrapPi(want - Math.PI), -limit, limit);
  o.face = angTo(o.face, want, 1 - Math.exp(-(turn || 9) * dt));
}

function amber(a){ return a >= 1 ? CFG.AMBER : 'rgba(255,176,0,'+a+')'; }
function purple(a){ return a >= 1 ? CFG.PURPLE : 'rgba(176,38,255,'+a+')'; }

/** Fixed-size object pool with O(1) alloc/release and swap-removal. */
function Pool(factory, size){
  this.free = []; this.active = [];
  for (let i=0;i<size;i++) this.free.push(factory());
}
Pool.prototype.alloc = function(){
  const o = this.free.pop();
  if (!o) return null;                 // at cap: caller skips the spawn
  this.active.push(o);
  return o;
};
Pool.prototype.release = function(i){
  const o = this.active[i];
  const last = this.active.pop();
  if (i < this.active.length) this.active[i] = last;
  this.free.push(o);
};
Pool.prototype.clear = function(){
  while (this.active.length) this.free.push(this.active.pop());
};

/* =============================== AUDIO ==================================
   Everything is synthesised at runtime: no audio files, nothing downloaded.
   Quality is deliberately retro (oscillators + noise), not orchestral.
   ======================================================================== */
const Audio2 = (function(){
  let ctx=null, master=null, sfxBus=null, musBus=null, noiseBuf=null, ready=false;
  const opt = { music:true, sfx:true };

  function load(){
    try{
      const raw = localStorage.getItem(CFG.OPT_KEY);
      if (raw){ const o = JSON.parse(raw); if (typeof o.music==='boolean') opt.music=o.music;
                if (typeof o.sfx==='boolean') opt.sfx=o.sfx; }
    }catch(e){}
  }
  function save(){ try{ localStorage.setItem(CFG.OPT_KEY, JSON.stringify(opt)); }catch(e){} }
  load();

  function init(){
    if (ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = 0.85; master.connect(ctx.destination);
    sfxBus = ctx.createGain(); sfxBus.gain.value = opt.sfx ? 0.9 : 0; sfxBus.connect(master);
    musBus = ctx.createGain(); musBus.gain.value = opt.music ? 0.34 : 0; musBus.connect(master);
    const n = ctx.sampleRate * 1.2;
    noiseBuf = ctx.createBuffer(1, n, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i=0;i<n;i++) d[i] = Math.random()*2-1;
    ready = true;
  }
  // iOS/Safari and Chrome autoplay policy: must resume inside a user gesture.
  function unlock(){
    init();
    if (ctx && ctx.state === 'suspended') ctx.resume().catch(()=>{});
  }
  const now = () => ctx ? ctx.currentTime : 0;
  const mtof = m => 440 * Math.pow(2,(m-69)/12);

  /* -- primitive voices ------------------------------------------------- */
  function tone(o){
    if (!ready || !opt.sfx) return;
    const t0 = o.t !== undefined ? o.t : now();
    const osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = o.type || 'square';
    osc.frequency.setValueAtTime(o.f0, t0);
    if (o.f1 !== undefined && o.f1 !== o.f0){
      if (o.slide === 'exp') osc.frequency.exponentialRampToValueAtTime(Math.max(1,o.f1), t0+o.dur);
      else osc.frequency.linearRampToValueAtTime(o.f1, t0+o.dur);
    }
    const peak = o.gain === undefined ? 0.3 : o.gain;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(peak, t0 + (o.atk||0.006));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + o.dur);
    let node = osc;
    if (o.filter){
      const f = ctx.createBiquadFilter();
      f.type = o.filter; f.frequency.value = o.cut||1200; f.Q.value = o.q||1;
      osc.connect(f); node = f;
    }
    node.connect(g); g.connect(o.bus || sfxBus);
    osc.start(t0); osc.stop(t0 + o.dur + 0.03);
  }
  function noise(o){
    if (!ready || !opt.sfx) return;
    const t0 = o.t !== undefined ? o.t : now();
    const src = ctx.createBufferSource(); src.buffer = noiseBuf;
    const f = ctx.createBiquadFilter();
    f.type = o.filter || 'bandpass';
    f.frequency.setValueAtTime(o.cut0 || 900, t0);
    if (o.cut1) f.frequency.exponentialRampToValueAtTime(Math.max(40,o.cut1), t0+o.dur);
    f.Q.value = o.q || 1.1;
    const g = ctx.createGain();
    const peak = o.gain === undefined ? 0.28 : o.gain;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(peak, t0 + (o.atk||0.005));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + o.dur);
    src.connect(f); f.connect(g); g.connect(o.bus || sfxBus);
    src.start(t0); src.stop(t0 + o.dur + 0.03);
  }

  /* -- sound effects ---------------------------------------------------- */
  const SFX = {
    fire(rate, tier){
      // Pitch drifts up with Cindu's fire rate; the body of the sound gains a
      // layer per fire tier, so a level-1 spit and a late-game fireball are
      // recognisably different shots. Gains stay low because at ~6 shots a
      // second the tails overlap.
      const t0 = now();
      const T = clamp(tier|0, 0, 4);
      const base = 620 + clamp((rate-2.5)*70, 0, 260);
      tone({type:'square', f0:base, f1:base*0.55, dur:0.075 + T*0.012,
            gain:0.11, slide:'exp'});
      noise({cut0:2600, cut1:1100 - T*140, dur:0.05 + T*0.018, gain:0.05 + T*0.010});
      if (T >= 1)                                    // reedy body under the crack
        tone({type:'sawtooth', f0:base*0.50, f1:base*0.22, dur:0.10 + T*0.02,
              gain:0.045 + T*0.012, slide:'exp', filter:'lowpass', cut:1800});
      if (T >= 2)                                    // the flame roar
        noise({cut0:900, cut1:220, dur:0.15 + T*0.03, gain:0.045 + T*0.010,
               filter:'bandpass', q:0.7, t:t0+0.01});
      if (T >= 3)                                    // sub thump on the launch
        tone({type:'sawtooth', f0:base*0.26, f1:base*0.12, dur:0.20, gain:0.065,
              slide:'exp', filter:'lowpass', cut:600, t:t0+0.01});
      if (T >= 4){                                   // king's breath: bite + tail
        tone({type:'square', f0:base*1.5, f1:base*0.6, dur:0.09, gain:0.045,
              slide:'exp', t:t0+0.015});
        noise({cut0:180, cut1:60, dur:0.26, gain:0.055, filter:'lowpass', t:t0+0.02});
      }
    },
    power(tier){
      const t0 = now();
      tone({type:'sawtooth', f0:110, f1:880, dur:0.34, gain:0.22, slide:'exp',
            filter:'lowpass', cut:2400});
      tone({type:'square', f0:220, f1:1760, dur:0.30+tier*0.05, gain:0.13, slide:'exp', t:t0+0.02});
      noise({cut0:400, cut1:5200, dur:0.42+tier*0.06, gain:0.20, filter:'bandpass', q:0.8});
      for (let i=0;i<=tier;i++)
        tone({type:'triangle', f0:mtof(62+i*5), dur:0.5, gain:0.07, t:t0+0.05+i*0.045});
    },
    enemyDie(){
      noise({cut0:1800, cut1:180, dur:0.24, gain:0.20, filter:'bandpass', q:0.7});
      tone({type:'square', f0:340, f1:70, dur:0.20, gain:0.10, slide:'exp'});
    },
    hurt(){
      tone({type:'sawtooth', f0:180, f1:90, dur:0.14, gain:0.13, slide:'exp',
            filter:'lowpass', cut:900});
    },
    playerDie(){
      const t0 = now();
      [64,60,57,52,45,38].forEach((m,i)=>
        tone({type:'sawtooth', f0:mtof(m), f1:mtof(m)*0.94, dur:0.55, gain:0.16,
              t:t0+i*0.17, filter:'lowpass', cut:1400}));
      noise({cut0:900, cut1:60, dur:1.9, gain:0.16, filter:'lowpass', t:t0+0.1});
    },
    lordSpawn(){
      const t0 = now();
      tone({type:'sawtooth', f0:mtof(29), dur:1.5, gain:0.24, filter:'lowpass', cut:700, t:t0});
      tone({type:'sawtooth', f0:mtof(36), dur:1.5, gain:0.16, filter:'lowpass', cut:900, t:t0});
      tone({type:'square', f0:mtof(41), f1:mtof(47), dur:1.3, gain:0.10, t:t0+0.18, slide:'exp'});
      noise({cut0:180, cut1:2800, dur:1.4, gain:0.14, filter:'bandpass', q:0.6, t:t0});
    },
    bossWin(){
      const t0 = now();
      [62,66,69,74,78,81].forEach((m,i)=>
        tone({type:'triangle', f0:mtof(m), dur:0.55, gain:0.17, t:t0+i*0.10}));
      [50,57,62].forEach(m => tone({type:'sawtooth', f0:mtof(m), dur:1.5, gain:0.09,
                                    t:t0+0.55, filter:'lowpass', cut:1500}));
    },
    levelUp(){
      const t0 = now();
      [69,73,76,81].forEach((m,i)=>
        tone({type:'triangle', f0:mtof(m), dur:0.30, gain:0.16, t:t0+i*0.075}));
    },
    /* A whole level is a hundred dragons. It gets its own fanfare: the
       level-up arpeggio carried a fifth higher over a rising swell, so
       `levelUp` above stays the smaller cue for POWER EVOLVED. */
    ascend(){
      const t0 = now();
      [69,73,76,81,88].forEach((m,i)=>
        tone({type:'triangle', f0:mtof(m), dur:0.42, gain:0.17, t:t0+i*0.08}));
      [57,64].forEach(m => tone({type:'square', f0:mtof(m), dur:0.9, gain:0.075,
                                 t:t0+0.10, filter:'lowpass', cut:1800}));
      tone({type:'sawtooth', f0:mtof(33), f1:mtof(45), dur:1.1, gain:0.11, t:t0,
            slide:'exp', filter:'lowpass', cut:1200});
      noise({cut0:300, cut1:6000, dur:0.75, gain:0.075, filter:'bandpass', q:0.7, t:t0});
    },
    /* `n` is the shard count after the pickup, 1..10. The pitch climbs across
       the ten, so the tenth blip audibly leans into the soul it completes. */
    shard(n){
      const f0 = 1000 + (((n || 1) - 1) % 10) * 78;
      tone({type:'triangle', f0, f1:f0*1.5, dur:0.06, gain:0.055, slide:'exp'});
    },
    /* A soul is ten shards -- it gets a body under the two notes: a third at
       the octave, a low swell and a short breath of noise. */
    soul(){
      const t0 = now();
      [76,83,88].forEach((m,i)=> tone({type:'triangle', f0:mtof(m), dur:0.26, gain:0.13, t:t0+i*0.055}));
      tone({type:'sawtooth', f0:mtof(38), f1:mtof(45), dur:0.60, gain:0.075, t:t0,
            slide:'exp', filter:'lowpass', cut:900});
      noise({cut0:500, cut1:4200, dur:0.34, gain:0.055, filter:'bandpass', q:0.9, t:t0});
    },
    select(){
      const t0 = now();
      tone({type:'square', f0:740, dur:0.045, gain:0.10, t:t0});
      tone({type:'square', f0:1108, dur:0.075, gain:0.09, t:t0+0.05});
    },
    deny(){ tone({type:'square', f0:200, f1:120, dur:0.14, gain:0.10, slide:'exp'}); },
    victory(){
      const t0 = now();
      [62,66,69,74,69,74,78,81,86].forEach((m,i)=>
        tone({type:'triangle', f0:mtof(m), dur:0.6, gain:0.17, t:t0+i*0.16}));
      [38,45,50].forEach(m => tone({type:'sawtooth', f0:mtof(m), dur:3.2, gain:0.08,
                                    t:t0+0.1, filter:'lowpass', cut:1200}));
    },
  };

  /* -- music: lookahead scheduler --------------------------------------
     Notes are scheduled against ctx.currentTime a little ahead of time.
     Firing them straight off setTimeout drifts audibly.                  */
  const TRIUMPH_ROOTS = [38,45,47,43];               // D  A  B  G
  const TRIUMPH_LEAD  = [[0,4,7,11],[0,4,7,9],[0,3,7,10],[0,4,7,11]];
  const BOSS_ROOTS    = [38,38,39,37];               // D  D  Eb Db  (unsettled)
  const BOSS_COLOUR   = [0,6,3,6];                   // tritone-heavy

  let track = null, step = 0, nextTime = 0, timer = null, bpm = 112;

  function schedule(){
    if (!ready || !ctx) return;
    const spb = 60 / bpm / 4;                        // one 16th note
    while (nextTime < ctx.currentTime + 0.12){
      playStep(step, nextTime, spb);
      step = (step + 1) % 64;
      nextTime += spb;
    }
  }
  function mus(o){
    if (!opt.music) return;
    o.bus = musBus; const s = opt.sfx; opt.sfx = true;  // bus-gated, not sfx-gated
    if (o.noise) noise(o); else tone(o);
    opt.sfx = s;
  }
  function playStep(s, t, spb){
    const bar = (s>>4) & 3, b16 = s & 15;
    if (track === 'triumph'){
      const root = TRIUMPH_ROOTS[bar];
      if (b16 % 4 === 0)                                     // driving bass
        mus({type:'sawtooth', f0:mtof(root-12), dur:spb*3.2, gain:0.20,
             filter:'lowpass', cut:520, t:t});
      if (b16 === 6 || b16 === 14)
        mus({type:'sawtooth', f0:mtof(root-5), dur:spb*1.6, gain:0.13,
             filter:'lowpass', cut:600, t:t});
      if (b16 % 2 === 0){                                    // major lead
        const ch = TRIUMPH_LEAD[bar];
        const n = root + 12 + ch[(b16>>1) % ch.length];
        mus({type:'square', f0:mtof(n), dur:spb*1.4, gain:0.075, t:t});
      }
      if (b16 % 8 === 0) mus({noise:true, cut0:120, cut1:60, dur:0.14, gain:0.22,
                              filter:'lowpass', t:t});        // kick
      if (b16 % 4 === 2) mus({noise:true, cut0:7000, dur:0.035, gain:0.055,
                              filter:'highpass', t:t});       // hat
    } else if (track === 'boss'){
      const root = BOSS_ROOTS[bar];
      if (b16 === 0)                                          // low dread drone
        mus({type:'sawtooth', f0:mtof(root-12), dur:spb*15, gain:0.22,
             filter:'lowpass', cut:340, t:t});
      if (b16 % 2 === 0)                                      // tremolo pulse
        mus({type:'triangle', f0:mtof(root-5), dur:spb*0.9, gain:0.085, t:t});
      if (b16 === 4 || b16 === 11)                            // tritone stab
        mus({type:'square', f0:mtof(root+BOSS_COLOUR[bar]+12), dur:spb*2.2,
             gain:0.075, t:t, filter:'lowpass', cut:1500});
      if (b16 % 8 === 0) mus({noise:true, cut0:100, cut1:55, dur:0.20, gain:0.24,
                              filter:'lowpass', t:t});
      if (b16 === 15) mus({noise:true, cut0:3000, cut1:400, dur:0.30, gain:0.07,
                           filter:'bandpass', t:t});
    }
  }
  function setTrack(name, phase){
    init();
    bpm = name === 'boss' ? 96 : 108 + clamp((phase||1)-1,0,9) * 4;   // tempo climbs per phase
    if (track === name) return;
    track = name; step = 0;
    if (ctx) nextTime = ctx.currentTime + 0.05;
    if (!timer) timer = setInterval(schedule, 25);
  }
  function stopMusic(){
    track = null;
    if (timer){ clearInterval(timer); timer = null; }
  }
  function setOpt(k,v){
    opt[k]=v; save();
    if (!ready) return;
    if (k==='music') musBus.gain.setTargetAtTime(v?0.34:0, now(), 0.05);
    if (k==='sfx')   sfxBus.gain.setTargetAtTime(v?0.9:0,  now(), 0.05);
  }
  return { unlock, SFX, setTrack, stopMusic, setOpt, opt,
           get ready(){ return ready; } };
})();

/* ============================ CANVAS / SCALING ========================== */
const cv  = document.getElementById('cv');
const ctx = cv.getContext('2d', { alpha:false });
const rotMsg = document.getElementById('rot');
let VIEW = { fit:1, dpr:1, cssW:CFG.W, cssH:CFG.H };

const IS_TOUCH = (('ontouchstart' in window) || navigator.maxTouchPoints > 0) &&
                 window.matchMedia('(pointer: coarse)').matches;

function resize(){
  const ww = window.innerWidth, wh = window.innerHeight;
  const fit = Math.min(ww / CFG.W, wh / CFG.H);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);   // uncapped DPR is a fill-rate tax
  VIEW = { fit, dpr, cssW:CFG.W*fit, cssH:CFG.H*fit };
  cv.style.width  = VIEW.cssW + 'px';
  cv.style.height = VIEW.cssH + 'px';
  cv.width  = Math.round(VIEW.cssW * dpr);
  cv.height = Math.round(VIEW.cssH * dpr);
  ctx.setTransform(fit*dpr, 0, 0, fit*dpr, 0, 0);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  rotMsg.style.display = (IS_TOUCH && ww > wh && wh < 520) ? 'flex' : 'none';
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));

/* Convert a DOM event to virtual game coordinates. */
function toGame(clientX, clientY){
  const r = cv.getBoundingClientRect();
  return { x:(clientX - r.left) / VIEW.fit, y:(clientY - r.top) / VIEW.fit };
}

/* ============================== SPRITES =================================
   Outline art is pre-rendered once into offscreen canvases with the glow
   baked in, then blitted. Running shadowBlur per stroke per frame is what
   kills framerate on a mid-range phone.
   ======================================================================== */
const SS = 2;                       // sprite supersample

function makeSprite(half, draw){
  const pad = 16, dim = Math.ceil(half*2 + pad*2);
  const c = document.createElement('canvas');
  c.width = dim*SS; c.height = dim*SS;
  const x = c.getContext('2d');
  x.scale(SS, SS); x.translate(dim/2, dim/2);
  x.lineJoin = 'round'; x.lineCap = 'round';
  draw(x);
  c.dim = dim;
  return c;
}

/* One dragon seen from above, nose at -y, drawn in units of `s`.
   Long neck, narrow serpentine body, and wings that dominate the silhouette. */
function dragonPath(x, s, f, opt){
  const o = opt || {};
  const tailY = o.tail === undefined ? 1.40 : o.tail;
  const L = (a,b) => x.lineTo(a*s, b*s);
  const M = (a,b) => x.moveTo(a*s, b*s);
  const Q = (a,b,c,d) => x.quadraticCurveTo(a*s, b*s, c*s, d*s);

  // --- body: wedge snout, long neck, narrow chest, tapering tail --------
  x.beginPath();
  M(0, -1.26);
  L(0.075,-1.06); L(0.115,-0.94);          // muzzle + jaw
  L(0.055,-0.78);                          // throat
  L(0.050,-0.50);                          // neck
  Q(0.14,-0.42, 0.175,-0.24);              // shoulder
  Q(0.195,-0.02, 0.140, 0.24);             // chest -> waist
  L(0.095, 0.52);                          // hips
  Q(0.055, 0.92, 0.024, tailY);            // tail
  L(-0.024, tailY);
  Q(-0.055, 0.92, -0.095, 0.52);
  L(-0.140, 0.24);
  Q(-0.195,-0.02, -0.175,-0.24);
  Q(-0.14,-0.42, -0.050,-0.50);
  L(-0.055,-0.78); L(-0.115,-0.94); L(-0.075,-1.06);
  x.closePath(); x.stroke();

  // --- wings: three-fingered membrane sweeping back from the shoulders --
  const sp = (1.44 + 0.30*f) * (o.span || 1);   // span grows on the downbeat
  const ty = -0.16 - 0.42*f;                    // wrist rises on the upbeat
  for (const m of [1,-1]){
    x.beginPath();
    M(m*0.150, -0.34);
    L(m*sp,          ty);                       // leading edge to the wrist
    L(m*sp*0.95,     ty+0.44);                  // finger 1
    L(m*sp*0.79,     ty+0.31);                  //   notch
    L(m*sp*0.73,     ty+0.74);                  // finger 2
    L(m*sp*0.55,     ty+0.58);                  //   notch
    L(m*sp*0.47,     ty+1.00);                  // finger 3
    L(m*sp*0.30,     ty+0.82);                  //   notch
    L(m*0.155,        0.30);                    // trailing root
    x.closePath(); x.stroke();
    x.beginPath();                              // wing bones
    M(m*0.160,-0.30); L(m*sp*0.83, ty+0.30);
    M(m*0.160,-0.30); L(m*sp*0.59, ty+0.57);
    M(m*0.160,-0.30); L(m*sp*0.34, ty+0.81);
    x.stroke();
  }

  // --- hind legs and claws ---------------------------------------------
  for (const m of [1,-1]){
    x.beginPath();
    M(m*0.130, 0.20); L(m*0.300, 0.40); L(m*0.255, 0.50);
    M(m*0.300, 0.40); L(m*0.345, 0.47);
    x.stroke();
  }

  // --- serpentine body lines -------------------------------------------
  x.beginPath();
  M(0.045,-0.42); Q(0.075, 0.10, 0.030, 0.62);
  M(-0.045,-0.42); Q(-0.075, 0.10, -0.030, 0.62);
  x.stroke();

  // --- tail barb --------------------------------------------------------
  x.beginPath();
  M(0, tailY-0.20); L(0.110, tailY+0.16); L(0, tailY+0.01); L(-0.110, tailY+0.16);
  x.closePath(); x.stroke();

  // --- horns, swept back over the neck ----------------------------------
  if (o.horns !== false){
    for (const m of [1,-1]){
      x.beginPath();
      M(m*0.080, -1.00);
      Q(m*0.270, -0.98, m*0.235, -0.70);
      x.stroke();
    }
  }
  // --- armour plating ---------------------------------------------------
  if (o.ridge){
    x.beginPath();
    M(0,-0.40); L(0.150,-0.06); L(0, 0.30); L(-0.150,-0.06);
    x.closePath();
    M(0,-0.16); L(0.075,-0.06); L(0, 0.06); L(-0.075,-0.06); x.closePath();
    x.stroke();
  }
  // --- royal crest ------------------------------------------------------
  if (o.crown){
    x.beginPath();
    for (let i=-2;i<=2;i++){
      M(i*0.055, -0.62);
      L(i*0.105, -0.62 - (0.34 - Math.abs(i)*0.07));
    }
    x.stroke();
  }
}

/* Purple eyes: the one non-amber detail on a dragon. */
function dragonEyes(x, s){
  x.save();
  x.shadowColor = CFG.PURPLE; x.shadowBlur = 7;
  x.strokeStyle = CFG.PURPLE; x.lineWidth = 1.5;
  for (const m of [1,-1]){
    x.beginPath(); x.arc(m*0.055*s, -0.965*s, 0.028*s, 0, TAU); x.stroke();
  }
  x.restore();
}

/* Glow layers: wide purple bloom, tight amber bloom, crisp amber line. */
function glowStroke(x, draw, opts){
  const o = opts || {};
  x.save();
  x.shadowColor = CFG.PURPLE; x.shadowBlur = o.pb === undefined ? 11 : o.pb;
  x.strokeStyle = purple(0.55); x.lineWidth = o.lwOuter || 2.1; draw(x);
  x.shadowColor = CFG.AMBER;  x.shadowBlur = o.ab === undefined ? 5 : o.ab;
  x.strokeStyle = amber(0.75); x.lineWidth = o.lwMid || 1.35; draw(x);
  x.shadowBlur = 0;
  x.strokeStyle = CFG.AMBER; x.lineWidth = o.lw || 0.95; draw(x);
  x.restore();
}

const SPR = {};
/* Box the sprite from the real geometry: widest wing tip vs longest tail,
   plus room for the glow. Guessing this by hand clips the wings. */
function spriteHalf(K){
  const wing = 1.74 * (K.span || 1) * K.s;          // max span on the downbeat
  const len  = ((K.tail === undefined ? 1.40 : K.tail) + 0.22) * K.s;
  return Math.ceil(Math.max(wing, len, 1.30*K.s) + (K.pb || 11) + 4);
}
function buildSprites(){
  const kinds = {
    cindu  : { s:27, span:1.10, crown:true, tail:1.45, lw:1.25, lwMid:1.7,
               lwOuter:2.6, pb:15, eyes:true },
    minor  : { s:17, span:0.92, tail:1.15 },
    swift  : { s:16, span:1.26, tail:0.95, horns:false, lw:0.85 },
    caster : { s:18, span:0.76, tail:1.34, crown:true },
    armored: { s:18, span:0.80, tail:0.95, ridge:true, lw:1.25, lwMid:1.7 },
  };
  for (const k in kinds){
    const K = kinds[k];
    K.half = spriteHalf(K);
    SPR[k] = [0,1,2].map(fi => {
      const f = [0.15, 0.55, 0.95][fi];
      return makeSprite(K.half, x => {
        glowStroke(x, xx => dragonPath(xx, K.s, f, K),
                   { lw:K.lw, lwMid:K.lwMid, lwOuter:K.lwOuter, pb:K.pb });
        if (K.eyes) dragonEyes(x, K.s);
      });
    });
  }
  // Cindu with a purple soul-core overlay for the level-up flash
  SPR.core = makeSprite(30, x => {
    x.save();
    x.shadowColor = CFG.PURPLE; x.shadowBlur = 26;
    x.strokeStyle = CFG.PURPLE; x.lineWidth = 2.4;
    x.beginPath(); x.arc(0,0,16,0,TAU); x.stroke();
    x.beginPath(); x.arc(0,0,9,0,TAU); x.stroke();
    x.restore();
  });
}

function blit(spr, x, y, rot, alpha, scale){
  ctx.save();
  ctx.translate(x, y);
  if (rot) ctx.rotate(rot);
  if (scale && scale !== 1) ctx.scale(scale, scale);
  if (alpha !== undefined && alpha < 1) ctx.globalAlpha = alpha;
  ctx.drawImage(spr, -spr.dim/2, -spr.dim/2, spr.dim, spr.dim);
  ctx.restore();
}
