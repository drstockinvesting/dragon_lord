# Publishes the game to GitHub Pages on every push to main, so the play link
# stays the same URL forever and always serves the latest merged version:
#
#     https://drstockinvesting.github.io/dragon_lord/
#
# Nothing here needs a secret, but Pages does need two things done once, by a
# human with admin rights, before this workflow can succeed:
#
#   1. the repository must be public;
#   2. Settings -> Pages -> Build and deployment -> Source must be "GitHub Actions".
#
# Step 2 cannot be automated from here. configure-pages does take an
# `enablement: true` input that calls the create-a-Pages-site API, but the
# Actions GITHUB_TOKEN is not permitted to create a Pages site no matter what
# `permissions:` grants it -- it fails with "Resource not accessible by
# integration". So the input is not used, and this workflow assumes Pages is
# already switched on.
name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a run in progress finish rather than cancelling it -- a half-applied
# deploy would leave the live link serving nothing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # build-site.py reads the commit date and sha for the build stamp.
          fetch-depth: 0

      - uses: actions/configure-pages@v5

      - name: Build _site
        run: python3 scripts/build-site.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
